name: Patch restore target test una tantum

on:
  push:
    paths:
      - '.github/workflows/patch-restore-target-project-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Applica patch e verifica sintassi
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/ripristino-registratore.cjs')
          s=p.read_text()
          def r(old,new):
              global s
              if s.count(old)!=1: raise SystemExit(f'match inatteso per {old!r}: {s.count(old)}')
              s=s.replace(old,new,1)
          r("const FIRESTORE_MODE = String(process.env.FIRESTORE_MODE || 'merge').toLowerCase();",
            "const TARGET_PROJECT_ID = process.env.PROJECT_ID;\nconst BACKUP_PROJECT_ID = process.env.BACKUP_PROJECT_ID || TARGET_PROJECT_ID;\nconst FIRESTORE_MODE = String(process.env.FIRESTORE_MODE || 'merge').toLowerCase();")
          r("const credentials = JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);\nadmin.initializeApp({ credential: admin.credential.cert(credentials), projectId: process.env.PROJECT_ID });",
            "const credentials = JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);\nif (!TARGET_PROJECT_ID) throw new Error('PROJECT_ID target non impostato');\nif (credentials.project_id && credentials.project_id !== TARGET_PROJECT_ID) throw new Error(`Service account ${credentials.project_id} non corrisponde al target ${TARGET_PROJECT_ID}`);\nif (String(process.env.REQUIRE_DIFFERENT_TARGET || '') === '1' && TARGET_PROJECT_ID === BACKUP_PROJECT_ID) throw new Error('Blocco sicurezza: il progetto test coincide con il progetto sorgente');\nadmin.initializeApp({ credential: admin.credential.cert(credentials), projectId: TARGET_PROJECT_ID });")
          r("manifest.format !== 'riflessa-registratore-encrypted-v3' || manifest.projectId !== process.env.PROJECT_ID",
            "manifest.format !== 'riflessa-registratore-encrypted-v3' || manifest.projectId !== BACKUP_PROJECT_ID")
          r("payload.format !== 'riflessa-registratore-payload-v3' || payload.projectId !== process.env.PROJECT_ID",
            "payload.format !== 'riflessa-registratore-payload-v3' || payload.projectId !== BACKUP_PROJECT_ID")
          p.write_text(s)
          PY
          node --check scripts/ripristino-registratore.cjs
          git diff --check
      - name: Commit patch e rimuovi workflow temporaneo
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-restore-target-project-once.yml
          git add scripts/ripristino-registratore.cjs
          git commit -m 'Separa progetto sorgente e target nel restore'
          git push origin HEAD:main
