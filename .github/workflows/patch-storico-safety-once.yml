name: Patch sicurezza resi storico una tantum

on:
  push:
    paths:
      - '.github/workflows/patch-storico-safety-once.yml'

permissions:
  contents: write

env:
  APP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          path: workflow-src
          persist-credentials: true
      - name: Checkout app privata
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          token: ${{ env.SOURCE_PAT }}
          path: app-repo
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collega storico al controller fiscale protetto
        working-directory: app-repo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/app.js')
          s=app.read_text()
          old="window.riflessaReceiptActions=Object.freeze({\n  openSale(sale,relatedReturns=[]){mergeHistoricalReturnsIntoState(relatedReturns);return openSaleModal(sale);},\n  quickVoid(sale,relatedReturns=[]){mergeHistoricalReturnsIntoState(relatedReturns);return quickVoidSale(sale);}\n});"
          new="window.riflessaReceiptActions=Object.freeze({\n  openSale(sale,relatedReturns=[]){mergeHistoricalReturnsIntoState(relatedReturns);document.dispatchEvent(new CustomEvent('riflessa:historical-sale-selected',{detail:{saleId:sale?.id||''}}));return openSaleModal(sale);},\n  quickVoid(sale,relatedReturns=[]){mergeHistoricalReturnsIntoState(relatedReturns);document.dispatchEvent(new CustomEvent('riflessa:historical-sale-selected',{detail:{saleId:sale?.id||''}}));return quickVoidSale(sale);}\n});"
          if s.count(old)!=1: raise SystemExit(f'bridge app inatteso: {s.count(old)}')
          app.write_text(s.replace(old,new,1))

          safety=Path('riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/final-safety.js')
          t=safety.read_text()
          marker="const $ = id => document.getElementById(id);\n"
          addition="const $ = id => document.getElementById(id);\ndocument.addEventListener('riflessa:historical-sale-selected',event=>{\n  const saleId=String(event?.detail?.saleId||'').trim();\n  if(saleId)activeSaleId=saleId;\n});\n"
          if t.count(marker)!=1: raise SystemExit(f'marker safety inatteso: {t.count(marker)}')
          safety.write_text(t.replace(marker,addition,1))
          PY
          node --check riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/app.js
          node --check riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/final-safety.js
          node --check riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/sales-history-by-date.js
          git diff --check
      - name: Commit app
        working-directory: app-repo
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/app.js riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/final-safety.js
          git commit -m 'Collega lo storico al flusso fiscale protetto'
          git push origin HEAD:main
      - name: Rimuovi workflow temporaneo
        working-directory: workflow-src
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-storico-safety-once.yml
          git commit -m 'Rimuove patch temporanea sicurezza storico'
          git push origin HEAD:main
