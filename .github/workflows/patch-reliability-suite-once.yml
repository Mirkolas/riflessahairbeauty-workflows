name: Patch affidabilita registratore una tantum

on:
  push:
    paths:
      - '.github/workflows/patch-reliability-suite-once.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mirkolas/riflessahairbeauty
          ref: main
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Applica patch affidabilita
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions')

          def replace_once(path, old, new, label):
              p=root/path
              s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: atteso 1 match, trovati {n}')
              p.write_text(s.replace(old,new,1))

          # main.js: store idempotenza persistente + stato operativo.
          replace_once(Path('electron/main.js'),
            "const crypto = require('crypto');\n",
            "const crypto = require('crypto');\nconst { FiscalIdempotencyStore, payloadHash } = require('./axon/fiscal-idempotency');\n",
            'main require idempotency')
          replace_once(Path('electron/main.js'),
            "let fiscalQueue = Promise.resolve();\n",
            "let fiscalQueue = Promise.resolve();\nlet fiscalQueueDepth = 0;\nlet fiscalActiveLabel = '';\nlet fiscalIdempotency = null;\n",
            'main queue globals')
          replace_once(Path('electron/main.js'),
            "function withFiscalLock(label, fn) {\n  const run = fiscalQueue.then(async () => {\n    appendMaster(paths().masterTxt, 'fiscal.lock.start', { label, at: new Date().toISOString() });\n    try { return await fn(); }\n    finally { appendMaster(paths().masterTxt, 'fiscal.lock.end', { label, at: new Date().toISOString() }); }\n  });\n  fiscalQueue = run.catch(() => {});\n  return run;\n}\n",
            "function withFiscalLock(label, fn) {\n  fiscalQueueDepth += 1;\n  const run = fiscalQueue.then(async () => {\n    fiscalActiveLabel = label;\n    appendMaster(paths().masterTxt, 'fiscal.lock.start', { label, at: new Date().toISOString() });\n    try { return await fn(); }\n    finally {\n      fiscalQueueDepth = Math.max(0, fiscalQueueDepth - 1);\n      fiscalActiveLabel = '';\n      appendMaster(paths().masterTxt, 'fiscal.lock.end', { label, at: new Date().toISOString() });\n    }\n  });\n  fiscalQueue = run.catch(() => {});\n  return run;\n}\n",
            'main fiscal lock')
          replace_once(Path('electron/main.js'),
            "    profile: path.join(base, 'axon-profile.json'),\n    masterTxt: path.join(base, 'RIFLESSA_SERVICE_LOG.txt')\n",
            "    profile: path.join(base, 'axon-profile.json'),\n    idempotency: path.join(base, 'fiscal-idempotency.json'),\n    masterTxt: path.join(base, 'RIFLESSA_SERVICE_LOG.txt')\n",
            'main path idempotency')
          replace_once(Path('electron/main.js'),
            "function profile() { return loadProfile(ensureProfile()); }\n",
            "function profile() { return loadProfile(ensureProfile()); }\nfunction idempotencyStore() {\n  if (!fiscalIdempotency) fiscalIdempotency = new FiscalIdempotencyStore(paths().idempotency);\n  return fiscalIdempotency;\n}\nfunction idempotencyDecision(store, key, payload, label) {\n  const claim = store.claim(key, payload);\n  if (claim.action === 'replay') return { handled:true, result:{ ...claim.result, idempotentReplay:true, idempotencyKey:key } };\n  if (claim.action === 'blocked' || claim.action === 'conflict') {\n    return { handled:true, result:fiscalUncertainResult('AXON_DUPLICATE_GUARD', `${label}: operazione già iniziata o payload diverso per la stessa chiave. NON reinviare senza verifica.`, { idempotencyKey:key, duplicateGuard:true }) };\n  }\n  return { handled:false, claim };\n}\n",
            'main idempotency helpers')
          replace_once(Path('electron/main.js'),
            "ipcMain.handle('axon:getStatus', async () => ({ appVersion: app.getVersion(), host: RT_HOST, profile: profile() }));\n",
            "ipcMain.handle('axon:getStatus', async () => ({ appVersion: app.getVersion(), host: RT_HOST, profile: profile() }));\nipcMain.handle('axon:getOperationalState', async (event) => {\n  trusted(event);\n  const files = listBackupFilesRecursive(paths().base);\n  const latest = files.reduce((m, x) => Math.max(m, Number(x.mtimeMs || 0)), 0);\n  return {\n    ok:true, appVersion:app.getVersion(), queueDepth:fiscalQueueDepth, activeFiscalOperation:fiscalActiveLabel || '',\n    latestLocalBackupMtime:latest || null, idempotency:idempotencyStore().summary()\n  };\n});\nipcMain.handle('axon:resolveIdempotency', async (event, payload) => {\n  trusted(event);\n  const key=String(payload?.key||'').trim();\n  if(!key) return {ok:false,message:'Chiave idempotenza mancante'};\n  const resolution=payload?.resolution==='emitted'?'emitted':'not_emitted';\n  idempotencyStore().resolve(key,resolution,payload?.result||null);\n  return {ok:true,key,resolution};\n});\n",
            'main operational ipc')

          # printReceipt: claim/replay/blocco e persistenza stato.
          replace_once(Path('electron/main.js'),
            "ipcMain.handle('axon:printReceipt', async (event, payload) => withFiscalLock('printReceipt', async () => {\n  trusted(event); const l = logger('receipt');\n",
            "ipcMain.handle('axon:printReceipt', async (event, payload) => withFiscalLock('printReceipt', async () => {\n  trusted(event); const l = logger('receipt');\n  const txId=String(payload?.clientTransactionId||payload?.saleId||'').trim();\n  if(!txId) return {ok:false,blocked:true,code:'AXON_IDEMPOTENCY_KEY_MISSING',message:'Identificativo univoco vendita mancante.'};\n  const idemKey=`receipt:${txId}`;\n  const idem=idempotencyDecision(idempotencyStore(),idemKey,payload,'Vendita fiscale');\n  if(idem.handled){ l.write('receipt.idempotency',idem.result); return idem.result; }\n",
            'main receipt claim')
          replace_once(Path('electron/main.js'),
            "    l.write('receipt.preStatus.error', result); return result;\n",
            "    idempotencyStore().release(idemKey);\n    l.write('receipt.preStatus.error', result); return result;\n",
            'main receipt preflight release')
          replace_once(Path('electron/main.js'),
            "        l.write('receipt.uncertain', uncertain); return uncertain;\n",
            "        idempotencyStore().uncertain(idemKey,payload,uncertain);\n        l.write('receipt.uncertain', uncertain); return uncertain;\n",
            'main receipt uncertain')
          replace_once(Path('electron/main.js'),
            "    l.write('receipt.result', result); return result;\n",
            "    if(result?.ok) idempotencyStore().complete(idemKey,payload,result);\n    else if(result?.uncertain||result?.noAutomaticRetry||result?.protocolAccepted) idempotencyStore().uncertain(idemKey,payload,result);\n    else idempotencyStore().release(idemKey);\n    l.write('receipt.result', result); return result;\n",
            'main receipt result')
          replace_once(Path('electron/main.js'),
            "    const result = { ok:false, code:'AXON_PRINT_ERROR', message:e.message, noAutomaticRetry:true, rtBefore, rtAfter };\n    l.write('receipt.error', result); return result;\n",
            "    const result = fiscalUncertainResult('AXON_PRINT_ERROR', `${e.message}. L'operazione era già entrata nel flusso fiscale: NON ripetere senza verifica.`, { rtBefore, rtAfter, idempotencyKey:idemKey });\n    idempotencyStore().uncertain(idemKey,payload,result);\n    l.write('receipt.error', result); return result;\n",
            'main receipt catch')

          # afterSale: idempotenza su returnId/operationId.
          replace_once(Path('electron/main.js'),
            "ipcMain.handle('axon:afterSale', async (event, payload) => withFiscalLock('afterSale', async () => {\n  trusted(event); const l=logger(payload?.type==='return'?'return-document':'void-document');\n  try {\n",
            "ipcMain.handle('axon:afterSale', async (event, payload) => withFiscalLock('afterSale', async () => {\n  trusted(event); const l=logger(payload?.type==='return'?'return-document':'void-document');\n  const operationId=String(payload?.operationId||'').trim();\n  const idemKey=operationId?`afterSale:${operationId}`:'';\n  if(idemKey){const idem=idempotencyDecision(idempotencyStore(),idemKey,payload,'Reso/annullo fiscale');if(idem.handled){l.write('after-sale.idempotency',idem.result);return idem.result;}}\n  try {\n",
            'main aftersale claim')
          replace_once(Path('electron/main.js'),
            "      return {...out,preflight,before,after:changed.status,journal:changed.ej,fiscalReference:changed.lastdoc};\n",
            "      const result={...out,preflight,before,after:changed.status,journal:changed.ej,fiscalReference:changed.lastdoc};\n      if(idemKey)idempotencyStore().complete(idemKey,payload,result);\n      return result;\n",
            'main aftersale complete')
          replace_once(Path('electron/main.js'),
            "      l.write('after-sale.uncertain', uncertain); return uncertain;\n",
            "      if(idemKey)idempotencyStore().uncertain(idemKey,payload,uncertain);\n      l.write('after-sale.uncertain', uncertain); return uncertain;\n",
            'main aftersale uncertain')
          replace_once(Path('electron/main.js'),
            "    return {ok:false,message:e.message,noAutomaticRetry:true,status};\n  }\n}));\n\nipcMain.handle('axon:soldTotals'",
            "    const result={ok:false,uncertain:true,message:e.message,noAutomaticRetry:true,status};\n    if(idemKey)idempotencyStore().uncertain(idemKey,payload,result);\n    return result;\n  }\n}));\n\nipcMain.handle('axon:soldTotals'",
            'main aftersale catch')

          # final-safety: intent persistente e audit.
          replace_once(Path('js/final-safety.js'),
            "const RECOVERY_KEY = 'riflessaFiscalRecoveryV355';\n",
            "const RECOVERY_KEY = 'riflessaFiscalRecoveryV355';\nconst ACTIVE_INTENT_KEY = 'riflessaFiscalActiveIntentV356';\n",
            'safety intent key')
          replace_once(Path('js/final-safety.js'),
            "function currentManualHold() { return readRecovery().find(x=>x.type==='saleUncertain'); }\n",
            "function currentManualHold() { return readRecovery().find(x=>x.type==='saleUncertain'); }\nfunction readActiveIntent(){try{return JSON.parse(localStorage.getItem(ACTIVE_INTENT_KEY)||'null');}catch{return null;}}\nfunction writeActiveIntent(intent){try{localStorage.setItem(ACTIVE_INTENT_KEY,JSON.stringify({...intent,updatedAt:new Date().toISOString()}));}catch{}}\nfunction patchActiveIntent(patch){const x=readActiveIntent();if(x)writeActiveIntent({...x,...patch});}\nfunction clearActiveIntent(clientTransactionId=''){const x=readActiveIntent();if(!x)return;if(!clientTransactionId||x.clientTransactionId===clientTransactionId){try{localStorage.removeItem(ACTIVE_INTENT_KEY);}catch{}}}\nasync function auditFiscal(targetType,targetId,event,data={}){\n  if(!currentUser||!targetId)return;\n  try{await addDoc(collection(db,'fiscalAudit'),{targetType,targetId,event,data,operatorUid:currentUser.uid,createdAt:serverTimestamp(),createdAtClient:new Date().toISOString()});}catch(e){console.warn('audit fiscale',event,e);}\n}\n",
            'safety intent helpers')
          replace_once(Path('js/final-safety.js'),
            "  const saleNote=($('saleNote')?.value||'').trim();\n  const clientTransactionId=crypto.randomUUID();\n  let saleRef=null;\n",
            "  const saleNote=($('saleNote')?.value||'').trim();\n  const existingIntent=readActiveIntent();\n  if(existingIntent){checkoutHold=`Esiste una vendita interrotta da verificare (${centsEuro(existingIntent.totalCents||0)}). Non iniziare una nuova vendita.`;return notify(checkoutHold,'error',9000);}\n  const clientTransactionId=crypto.randomUUID();\n  writeActiveIntent({clientTransactionId,totalCents:pricing.total,businessDate:dateKey(),stage:'prepared',createdAt:new Date().toISOString()});\n  let saleRef=null;\n  let fiscalCallStarted=false;\n",
            'safety create intent')
          replace_once(Path('js/final-safety.js'),
            "      fiscalStatus:'pending',cashSessionId:session.id,afterSaleStatus:'none',returnedCents:0\n    });\n\n    const result=await window.axonPrinter.printReceipt",
            "      fiscalStatus:'pending',cashSessionId:session.id,afterSaleStatus:'none',returnedCents:0\n    });\n    patchActiveIntent({saleId:saleRef.id,stage:'sale-created'});\n    await auditFiscal('sale',saleRef.id,'sale.pending',{clientTransactionId,totalCents:pricing.total,paymentMethod:normalizedMethod});\n    fiscalCallStarted=true;patchActiveIntent({stage:'fiscal-call-started'});\n\n    const result=await window.axonPrinter.printReceipt",
            'safety intent before print')
          replace_once(Path('js/final-safety.js'),
            "        const key=upsertRecovery({type:'saleUncertain',saleId:saleRef.id,totalCents:pricing.total,lines:pricing.lines,clientId,businessDate:dateKey(),result:result||{},key:`saleUncertain:${saleRef.id}`});\n",
            "        patchActiveIntent({stage:'uncertain'});\n        const key=upsertRecovery({type:'saleUncertain',saleId:saleRef.id,totalCents:pricing.total,lines:pricing.lines,clientId,businessDate:dateKey(),clientTransactionId,result:result||{},key:`saleUncertain:${saleRef.id}`});\n        await auditFiscal('sale',saleRef.id,'sale.uncertain',{clientTransactionId,code:result?.code||'',message:result?.message||''});\n",
            'safety uncertain recovery')
          replace_once(Path('js/final-safety.js'),
            "      }else{\n        setPrintStatus(result?.message||'Stampa non riuscita. Nessun documento confermato.','error');\n",
            "      }else{\n        clearActiveIntent(clientTransactionId);\n        await auditFiscal('sale',saleRef.id,'sale.not_emitted',{clientTransactionId,code:result?.code||''});\n        setPrintStatus(result?.message||'Stampa non riuscita. Nessun documento confermato.','error');\n",
            'safety definite failure clear')
          replace_once(Path('js/final-safety.js'),
            "    const printedJob={type:'salePrintedRecovery',saleId:saleRef.id,totalCents:pricing.total,lines:pricing.lines,clientId,businessDate:dateKey(),ref,fiscalResult:JSON.stringify(result),rtSerial:result.rtAfter?.device?.serial||'8AIGE005584',key:`salePrintedRecovery:${saleRef.id}`};\n",
            "    patchActiveIntent({stage:'rt-confirmed',fiscalRef:ref});\n    const printedJob={type:'salePrintedRecovery',saleId:saleRef.id,totalCents:pricing.total,lines:pricing.lines,clientId,businessDate:dateKey(),clientTransactionId,ref,fiscalResult:JSON.stringify(result),rtSerial:result.rtAfter?.device?.serial||'8AIGE005584',key:`salePrintedRecovery:${saleRef.id}`};\n",
            'safety printed job tx')
          replace_once(Path('js/final-safety.js'),
            "      await persistPrintedSale(printedJob);\n",
            "      await persistPrintedSale(printedJob);\n      await auditFiscal('sale',saleRef.id,'sale.printed',{clientTransactionId,z:ref.zno,doc:ref.docno,docbase:ref.docbase});\n",
            'safety printed audit')
          replace_once(Path('js/final-safety.js'),
            "      notify(`Scontrino fiscale OK Z ${ref.zno} / Doc ${ref.docno}; magazzino/punti saranno riallineati automaticamente.`,'error',8000);\n    }\n\n    resetSaleUi();\n",
            "      notify(`Scontrino fiscale OK Z ${ref.zno} / Doc ${ref.docno}; magazzino/punti saranno riallineati automaticamente.`,'error',8000);\n    }\n    clearActiveIntent(clientTransactionId);\n\n    resetSaleUi();\n",
            'safety clear intent success')
          replace_once(Path('js/final-safety.js'),
            "  }catch(e){\n    if(saleRef){\n      try{await updateDoc(saleRef,{fiscalStatus:'failed',fiscalResult:String(e?.message||e).slice(0,15000),updatedAt:serverTimestamp()});}catch{}\n    }\n    setPrintStatus(`Operazione non completata: ${e?.message||e}`,'error');notify(e?.message||String(e),'error',7000);\n",
            "  }catch(e){\n    if(saleRef){\n      if(fiscalCallStarted){\n        try{await updateDoc(saleRef,{fiscalStatus:'uncertain',fiscalResult:String(e?.message||e).slice(0,15000),updatedAt:serverTimestamp()});}catch{}\n        patchActiveIntent({stage:'uncertain'});\n        upsertRecovery({type:'saleUncertain',saleId:saleRef.id,totalCents:pricing.total,lines:pricing.lines,clientId,businessDate:dateKey(),clientTransactionId,result:{message:String(e?.message||e),source:'renderer-catch'},key:`saleUncertain:${saleRef.id}`});\n        await auditFiscal('sale',saleRef.id,'sale.uncertain_exception',{clientTransactionId,message:String(e?.message||e)});\n        checkoutHold='Operazione fiscale interrotta con esito non certo. NON ripetere la vendita senza verifica RT.';\n      }else{\n        try{await updateDoc(saleRef,{fiscalStatus:'failed',fiscalResult:String(e?.message||e).slice(0,15000),updatedAt:serverTimestamp()});}catch{}\n        clearActiveIntent(clientTransactionId);\n      }\n    }else clearActiveIntent(clientTransactionId);\n    setPrintStatus(`Operazione non completata: ${e?.message||e}`,'error');notify(e?.message||String(e),'error',7000);\n",
            'safety catch uncertain')
          replace_once(Path('js/final-safety.js'),
            "  const fiscalPayload=printed?{type,date:fiscalDate,zNo:fiscalZ,docNo:fiscalDocNo,sameDevice:true,lines:selected.map(x=>({qty:x.qty,unitPriceCents:x.unitPriceCents,departmentId:x.departmentId,vatRate:x.vatRate,nature:x.nature}))}:null;\n  const returnRef=doc(collection(db,'returns'));\n",
            "  const returnRef=doc(collection(db,'returns'));\n  const fiscalPayload=printed?{operationId:returnRef.id,type,date:fiscalDate,zNo:fiscalZ,docNo:fiscalDocNo,sameDevice:true,lines:selected.map(x=>({qty:x.qty,unitPriceCents:x.unitPriceCents,departmentId:x.departmentId,vatRate:x.vatRate,nature:x.nature}))}:null;\n",
            'safety aftersale operation id')
          replace_once(Path('js/final-safety.js'),
            "    $('saleModal')?.classList.add('hidden');\n",
            "    await auditFiscal('sale',sale.id,'return.created',{returnId:returnRef.id,type,totalCents,fiscalRequired:printed});\n    $('saleModal')?.classList.add('hidden');\n",
            'safety return audit created')
          replace_once(Path('js/final-safety.js'),
            "      if(job.type==='salePrintedRecovery'){\n        await persistPrintedSale(job);await completeSaleManagement(job);removeRecovery(job.key);\n      }else if(job.type==='saleManagement'){\n        await completeSaleManagement(job);removeRecovery(job.key);\n",
            "      if(job.type==='salePrintedRecovery'){\n        await persistPrintedSale(job);await completeSaleManagement(job);removeRecovery(job.key);clearActiveIntent(job.clientTransactionId||'');await auditFiscal('sale',job.saleId,'sale.recovered',{type:job.type});\n      }else if(job.type==='saleManagement'){\n        await completeSaleManagement(job);removeRecovery(job.key);clearActiveIntent(job.clientTransactionId||'');await auditFiscal('sale',job.saleId,'sale.management_recovered',{});\n",
            'safety recovery clear intent')
          replace_once(Path('js/final-safety.js'),
            "    try{await persistPrintedSale(printedJob);await completeSaleManagement(printedJob);removeRecovery(job.key);checkoutHold='';notify('Vendita verificata come emessa e gestione riallineata','success');resetSaleUi();}\n",
            "    try{await persistPrintedSale(printedJob);await completeSaleManagement(printedJob);removeRecovery(job.key);clearActiveIntent(job.clientTransactionId||'');try{await window.axonPrinter?.resolveIdempotency?.({key:`receipt:${job.clientTransactionId||''}`,resolution:'emitted',result:{ok:true,fiscalReference:ref}});}catch{}checkoutHold='';await auditFiscal('sale',job.saleId,'sale.manual_verified_emitted',{z,doc:n});notify('Vendita verificata come emessa e gestione riallineata','success');resetSaleUi();}\n",
            'safety resolve emitted')
          replace_once(Path('js/final-safety.js'),
            "    try{await retryManagement(()=>updateDoc(saleRef,{fiscalStatus:'failed',fiscalResult:JSON.stringify({...job.result,manualVerification:'not-emitted'}).slice(0,15000),updatedAt:serverTimestamp()}));removeRecovery(job.key);checkoutHold='';notify('Esito verificato come non emesso. Puoi rifare la vendita.','success');clearBypass=true;try{$('clearBtn')?.click();}finally{clearBypass=false;}}\n",
            "    try{await retryManagement(()=>updateDoc(saleRef,{fiscalStatus:'failed',fiscalResult:JSON.stringify({...job.result,manualVerification:'not-emitted'}).slice(0,15000),updatedAt:serverTimestamp()}));removeRecovery(job.key);clearActiveIntent(job.clientTransactionId||'');try{await window.axonPrinter?.resolveIdempotency?.({key:`receipt:${job.clientTransactionId||''}`,resolution:'not_emitted'});}catch{}checkoutHold='';await auditFiscal('sale',job.saleId,'sale.manual_verified_not_emitted',{});notify('Esito verificato come non emesso. Puoi rifare la vendita.','success');clearBypass=true;try{$('clearBtn')?.click();}finally{clearBypass=false;}}\n",
            'safety resolve not emitted')

          # Recovery intent al login.
          replace_once(Path('js/final-safety.js'),
            "// Intercettazioni in fase capture: impediscono che i vecchi handler fiscali partano in parallelo.\n",
            "async function recoverActiveIntent(){\n  const intent=readActiveIntent();if(!intent||!currentUser)return;\n  if(!intent.saleId){clearActiveIntent(intent.clientTransactionId||'');return;}\n  try{\n    const snap=await getDoc(doc(db,'sales',intent.saleId));\n    if(!snap.exists()){clearActiveIntent(intent.clientTransactionId||'');return;}\n    const sale={id:snap.id,...snap.data()};\n    if(sale.fiscalStatus==='printed'){\n      try{await completeSaleManagement({saleId:sale.id,lines:sale.lines||[],clientId:sale.clientId||'',totalCents:sale.totalCents||0});}catch(e){console.warn('recovery intent management',e);}\n      clearActiveIntent(intent.clientTransactionId||'');return;\n    }\n    if(['failed','blocked'].includes(sale.fiscalStatus)){clearActiveIntent(intent.clientTransactionId||'');return;}\n    if(intent.stage==='sale-created'){\n      await updateDoc(doc(db,'sales',sale.id),{fiscalStatus:'failed',fiscalResult:'App riavviata prima dell avvio della chiamata fiscale',updatedAt:serverTimestamp()});\n      clearActiveIntent(intent.clientTransactionId||'');return;\n    }\n    await updateDoc(doc(db,'sales',sale.id),{fiscalStatus:'uncertain',updatedAt:serverTimestamp()});\n    upsertRecovery({type:'saleUncertain',saleId:sale.id,totalCents:sale.totalCents||intent.totalCents||0,lines:sale.lines||[],clientId:sale.clientId||'',businessDate:sale.businessDate||intent.businessDate||dateKey(),clientTransactionId:intent.clientTransactionId||sale.clientTransactionId||'',result:{message:'Ripristino dopo riavvio durante fase fiscale',source:'active-intent'},key:`saleUncertain:${sale.id}`});\n  }catch(e){console.warn('Ripristino intent vendita rinviato',e);}\n}\n\n// Intercettazioni in fase capture: impediscono che i vecchi handler fiscali partano in parallelo.\n",
            'safety recover intent function')
          replace_once(Path('js/final-safety.js'),
            "onAuthStateChanged(auth,user=>{\n  currentUser=user||null;cleanupSubscriptions();\n  if(!currentUser){checkoutHold='';return;}\n  subscribeSafetyState();\n  const manual=currentManualHold();\n",
            "onAuthStateChanged(auth,async user=>{\n  currentUser=user||null;cleanupSubscriptions();\n  if(!currentUser){checkoutHold='';return;}\n  subscribeSafetyState();\n  await recoverActiveIntent();\n  const manual=currentManualHold();\n",
            'safety auth recovery')

          # final-day-guard: coerenza completa prima della Z.
          replace_once(Path('js/final-day-guard.js'),
            "async function verifyRtReadyForClosure(){\n",
            "async function fullDayConsistency(){\n  const today=dateKey();\n  const [salesSnap,returnsSnap]=await Promise.all([\n    getDocs(query(collection(db,'sales'),where('businessDate','==',today),limit(1000))),\n    getDocs(query(collection(db,'returns'),where('requestedBusinessDate','==',today),limit(1000)))\n  ]);\n  const sales=salesSnap.docs.map(d=>({id:d.id,...d.data()}));\n  const returns=returnsSnap.docs.map(d=>({id:d.id,...d.data()}));\n  const core=globalThis.RiflessaReliabilityCore;\n  return core?.analyzeDay?core.analyzeDay({sales,returns}):{ok:true,critical:[],warnings:[],counts:{sales:sales.length,returns:returns.length}};\n}\n\nasync function verifyRtReadyForClosure(){\n",
            'day consistency function')
          replace_once(Path('js/final-day-guard.js'),
            "  try{await verifyRtReadyForClosure();}\n",
            "  try{\n    const consistency=await fullDayConsistency();\n    if(!consistency.ok){\n      const first=consistency.critical.slice(0,3).map(x=>x.message).join(' · ');\n      return notify(`Chiusura bloccata: controllo coerenza giornata fallito (${consistency.critical.length} problemi). ${first}`,'error',12000);\n    }\n    if(consistency.warnings.length&&!confirm(`Controllo giornata: ${consistency.warnings.length} avvisi non bloccanti. Vuoi continuare con la verifica RT per la chiusura?`))return;\n  }catch(e){return notify(`Impossibile completare il controllo di coerenza: ${e?.message||e}. Chiusura non avviata.`,'error',9000);}\n  try{await verifyRtReadyForClosure();}\n",
            'day consistency gate')

          # firestore rules fiscal audit append-only.
          replace_once(Path('firestore.rules'),
            "    match /_backupChanges/{id} {\n",
            "    match /fiscalAudit/{id} {\n      allow read: if isStaff();\n      allow create: if isStaff() && request.resource.data.operatorUid == request.auth.uid;\n      allow update, delete: if isAdmin();\n    }\n\n    match /_backupChanges/{id} {\n",
            'rules fiscal audit')

          # package release check command.
          p=root/'package.json';s=p.read_text();
          old='    "check": "node scripts/check-project.js",\n'
          new='    "check": "node scripts/check-project.js",\n    "release:check": "npm test && npm run check && node scripts/release-preflight.cjs",\n'
          if s.count(old)!=1:raise SystemExit('package release check match')
          p.write_text(s.replace(old,new,1))
          PY

          cat > riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/scripts/release-preflight.cjs <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const appRoot=path.resolve(__dirname,'..');
          const repoRoot=path.resolve(appRoot,'..','..');
          const backupRoot=path.join(repoRoot,'backup-registratore');
          const checkpoint=path.join(repoRoot,'.backup-checkpoints','registratore','resume.json');
          if(fs.existsSync(checkpoint))throw new Error('Rilascio bloccato: esiste un checkpoint backup registratore pendente.');
          if(!fs.existsSync(backupRoot))throw new Error('Rilascio bloccato: cartella backup-registratore non trovata.');
          const candidates=fs.readdirSync(backupRoot).filter(x=>x.startsWith('backup-')).sort().reverse();
          let latest=null;
          for(const name of candidates){
            const file=path.join(backupRoot,name,'manifest.json');if(!fs.existsSync(file))continue;
            const m=JSON.parse(fs.readFileSync(file,'utf8'));
            if(m.format==='riflessa-registratore-encrypted-v3'){latest={name,m};break;}
          }
          if(!latest)throw new Error('Rilascio bloccato: nessun backup v3 verificabile trovato.');
          const ageDays=(Date.now()-Date.parse(latest.m.createdAt))/86400000;
          const maxDays=Number(process.env.RIFLESSA_MAX_BACKUP_AGE_DAYS||14);
          if(!Number.isFinite(ageDays)||ageDays>maxDays)throw new Error(`Rilascio bloccato: ultimo backup v3 troppo vecchio (${ageDays.toFixed(1)} giorni, max ${maxDays}).`);
          if(!latest.m.archive?.cipherSha256||!latest.m.firestore?.totalDocumentCount)throw new Error('Rilascio bloccato: manifest backup incompleto.');
          console.log(`Release preflight OK: ${latest.name}, eta ${ageDays.toFixed(2)} giorni, ${latest.m.firestore.totalDocumentCount} documenti.`);
          NODE

          node --check riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/electron/main.js
          node --check riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/electron/preload.js
          node --check riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/electron/axon/fiscal-idempotency.js
          node --check riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/scripts/release-preflight.cjs
          git diff --check
      - name: Test automatici e release preflight
        working-directory: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
        run: |
          set -euo pipefail
          npm test
          node scripts/release-preflight.cjs
      - name: Commit nel repository applicazione
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
          git commit -m 'Rafforza recovery fiscale controlli giornalieri e stato sistema'
          git push origin HEAD:main
