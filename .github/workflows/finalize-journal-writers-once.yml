name: Completa journal writer registratore - una tantum

on:
  push:
    paths:
      - ".github/workflows/finalize-journal-writers-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  patch-deploy-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout applicazione privata
        uses: actions/checkout@v4
        with:
          repository: Mirkolas/riflessahairbeauty
          ref: main
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: app-repo
          persist-credentials: true

      - name: Collega tutti i writer al journal
        working-directory: app-repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js')
          old='https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js'
          new='./firestore-with-backup-journal.js'
          for name in ['final-safety.js','final-day-guard.js']:
              p=root/name
              s=p.read_text(encoding='utf-8')
              if new not in s:
                  if old not in s: raise SystemExit(f'{name}: import Firestore non trovato')
                  p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/final-safety.js \
                  riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/final-day-guard.js
          if ! git diff --cached --quiet; then
            git commit -m "Completa journal backup su tutti i writer Firestore"
            git push origin HEAD:main
          fi

      - name: Avvia deploy registratore
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run firebase-deploy-registratore.yml --repo Mirkolas/riflessahairbeauty-workflows --ref main

      - name: Avvia build Windows aggiornata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-exe-registratore.yml --repo Mirkolas/riflessahairbeauty-workflows --ref main
