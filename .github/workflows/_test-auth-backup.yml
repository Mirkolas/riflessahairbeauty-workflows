name: Test permesso Firebase Rules registratore

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_test-auth-backup.yml"

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  FIREBASE_TOKEN_VALUE: ${{ secrets.FIREBASE_TOKEN }}
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica presenza FIREBASE_TOKEN
        id: token
        shell: bash
        run: |
          if [[ -n "${FIREBASE_TOKEN_VALUE}" ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "FIREBASE_TOKEN presente: provo il deploy delle sole regole."
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "FIREBASE_TOKEN non configurato nella repo workflow."
          fi

      - name: Checkout app privata
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: Mirkolas/riflessahairbeauty
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: app
          persist-credentials: false

      - name: Configura Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa Firebase CLI
        if: steps.token.outputs.present == 'true'
        working-directory: app/riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Deploy sole regole Firestore con FIREBASE_TOKEN
        if: steps.token.outputs.present == 'true'
        working-directory: app/riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase deploy --project "${PROJECT_ID}" --only firestore:rules --token "${FIREBASE_TOKEN_VALUE}" --non-interactive
