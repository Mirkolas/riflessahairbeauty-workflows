name: CI workflow e script registratore

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-workflow-registratore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Controlla sintassi Node di tutti gli script
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Controllo ${file}"
            node --check "${file}"
          done < <(find scripts -type f \( -name '*.cjs' -o -name '*.js' \) -print0 | sort -z)

      - name: Controlla sintassi Python degli script GitHub
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' FILES < <(find .github/scripts -type f -name '*.py' -print0 2>/dev/null || true)
          if (( ${#FILES[@]} > 0 )); then
            python3 -m py_compile "${FILES[@]}"
          fi

      - name: Controlla tutti i YAML workflow
        shell: ruby {0}
        run: |
          require 'yaml'
          files = Dir['.github/workflows/*.{yml,yaml}'].sort
          abort 'Nessun workflow trovato' if files.empty?
          files.each do |file|
            YAML.load_file(file, aliases: true)
            puts "OK #{file}"
          end

      - name: Controlla whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
