name: Test reale backup restore una tantum

on:
  push:
    paths:
      - '.github/workflows/live-restore-e2e-once.yml'

permissions:
  contents: read

concurrency:
  group: firebase-test-restore-registratore
  cancel-in-progress: false

env:
  PROD_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  TEST_PROJECT_ID: ${{ vars.FIREBASE_TEST_PROJECT_ID }}
  TEST_RESTORE_ENABLED: ${{ vars.FIREBASE_TEST_RESTORE_ENABLED }}
  BACKUP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  TEST_GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_TEST_SERVICE_ACCOUNT }}
  AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Verifica opt-in e sicurezza target
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TEST_RESTORE_ENABLED}" != "true" ]]; then
            echo 'enabled=false' >> "${GITHUB_OUTPUT}"
            echo '::warning::Restore test non attivo: FIREBASE_TEST_RESTORE_ENABLED non e true.'
            exit 0
          fi
          [[ -n "${PROD_PROJECT_ID}" ]] || { echo '::error::Manca FIREBASE_PROJECT_ID'; exit 1; }
          [[ -n "${TEST_PROJECT_ID}" ]] || { echo '::error::Manca FIREBASE_TEST_PROJECT_ID'; exit 1; }
          [[ "${TEST_PROJECT_ID}" != "${PROD_PROJECT_ID}" ]] || { echo '::error::BLOCCO: progetto test uguale alla produzione'; exit 1; }
          [[ -n "${TEST_GOOGLE_CREDENTIALS_JSON}" ]] || { echo '::error::Manca FIREBASE_TEST_SERVICE_ACCOUNT'; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo '::error::Manca PUBLIC_REPO_TOKEN'; exit 1; }
          [[ -n "${AUTH_HASH_CONFIG}" ]] || { echo '::error::Manca FIREBASE_AUTH_HASH_CONFIG'; exit 1; }
          SA_PROJECT="$(node -e 'const c=JSON.parse(process.env.TEST_GOOGLE_CREDENTIALS_JSON);process.stdout.write(c.project_id||"")')"
          [[ "${SA_PROJECT}" == "${TEST_PROJECT_ID}" ]] || { echo "::error::Service account test appartiene a ${SA_PROJECT}, target ${TEST_PROJECT_ID}"; exit 1; }
          echo 'enabled=true' >> "${GITHUB_OUTPUT}"
          echo "Target test autorizzato: ${TEST_PROJECT_ID}"

      - name: Checkout workflow e script
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          path: workflow-src
          persist-credentials: false

      - name: Checkout backup privati
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Configura Node
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installa Firebase Admin e CLI
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/restore-tool" "${RUNNER_TEMP}/firebase-cli"
          npm install --prefix "${RUNNER_TEMP}/restore-tool" firebase-admin@13 --no-audit --no-fund >/dev/null
          npm install --prefix "${RUNNER_TEMP}/firebase-cli" firebase-tools --no-audit --no-fund >/dev/null

      - name: Seleziona ultimo backup v3
        if: steps.gate.outputs.enabled == 'true'
        id: backup
        working-directory: backup-repo
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_PATH=''
          while IFS= read -r candidate; do
            [[ -f "${candidate}/manifest.json" ]] || continue
            FORMAT="$(node -p "require('./${candidate}/manifest.json').format || ''")"
            if [[ "${FORMAT}" == 'riflessa-registratore-encrypted-v3' ]]; then BACKUP_PATH="${candidate}"; break; fi
          done < <(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' | sort -r)
          [[ -n "${BACKUP_PATH}" ]] || { echo '::error::Nessun backup v3'; exit 1; }
          echo "path=${BACKUP_PATH}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${BACKUP_PATH}")" >> "${GITHUB_OUTPUT}"

      - name: Verifica archivio sorgente
        if: steps.gate.outputs.enabled == 'true'
        working-directory: backup-repo
        env:
          PROJECT_ID: ${{ env.PROD_PROJECT_ID }}
          BACKUP_PATH: ${{ steps.backup.outputs.path }}
        run: node "${GITHUB_WORKSPACE}/workflow-src/scripts/verifica-backup-registratore.cjs"

      - name: Inserisce sonde extra nel progetto test
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/restore-tool/node_modules
          GOOGLE_CREDENTIALS_JSON: ${{ env.TEST_GOOGLE_CREDENTIALS_JSON }}
          PROJECT_ID: ${{ env.TEST_PROJECT_ID }}
          PROBE_UID: restore-probe-${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin=require('firebase-admin');
          const c=JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);
          admin.initializeApp({credential:admin.credential.cert(c),projectId:process.env.PROJECT_ID});
          (async()=>{
            await admin.firestore().doc('_restoreTestProbe/probe').set({runId:process.env.GITHUB_RUN_ID||'',createdAt:admin.firestore.FieldValue.serverTimestamp()});
            try{await admin.auth().createUser({uid:process.env.PROBE_UID,email:`${process.env.PROBE_UID}@invalid.example`,disabled:true});}catch(e){if(e.code!=='auth/uid-already-exists')throw e;}
            console.log('Sonde extra create.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Restore Firestore exact Auth replace e ricostruzione Hosting
        if: steps.gate.outputs.enabled == 'true'
        working-directory: backup-repo
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/restore-tool/node_modules
          GOOGLE_CREDENTIALS_JSON: ${{ env.TEST_GOOGLE_CREDENTIALS_JSON }}
          PROJECT_ID: ${{ env.TEST_PROJECT_ID }}
          BACKUP_PROJECT_ID: ${{ env.PROD_PROJECT_ID }}
          BACKUP_PATH: ${{ steps.backup.outputs.path }}
          BACKUP_FORMAT: v3
          FIRESTORE_MODE: exact
          AUTH_MODE: replace
          VERIFY_RESTORE: '1'
          REQUIRE_DIFFERENT_TARGET: '1'
          RESTORE_HOSTING_DIR: ${{ runner.temp }}/hosting-restored
        run: node "${GITHUB_WORKSPACE}/workflow-src/scripts/ripristino-registratore.cjs"

      - name: Deploy Hosting nel progetto test
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ env.TEST_GOOGLE_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="${RUNNER_TEMP}/hosting-deploy"
          CRED="${RUNNER_TEMP}/firebase-test-service-account.json"
          rm -rf "${DEPLOY_DIR}"
          mkdir -p "${DEPLOY_DIR}/public"
          rsync -a "${RUNNER_TEMP}/hosting-restored/hosting/" "${DEPLOY_DIR}/public/"
          printf '%s\n' '{"hosting":{"public":"public","ignore":[]}}' > "${DEPLOY_DIR}/firebase.json"
          printf '%s' "${GOOGLE_CREDENTIALS_JSON}" > "${CRED}"
          chmod 600 "${CRED}"
          cd "${DEPLOY_DIR}"
          GOOGLE_APPLICATION_CREDENTIALS="${CRED}" "${RUNNER_TEMP}/firebase-cli/node_modules/.bin/firebase" deploy --only hosting --project "${TEST_PROJECT_ID}" --config firebase.json --non-interactive
          rm -f "${CRED}"

      - name: Verifica semantica exact e probe eliminate
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/restore-tool/node_modules
          GOOGLE_CREDENTIALS_JSON: ${{ env.TEST_GOOGLE_CREDENTIALS_JSON }}
          PROJECT_ID: ${{ env.TEST_PROJECT_ID }}
          PROBE_UID: restore-probe-${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin=require('firebase-admin');
          const c=JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);
          admin.initializeApp({credential:admin.credential.cert(c),projectId:process.env.PROJECT_ID});
          (async()=>{
            const probe=await admin.firestore().doc('_restoreTestProbe/probe').get();
            if(probe.exists)throw new Error('Sonda Firestore non eliminata');
            try{await admin.auth().getUser(process.env.PROBE_UID);throw new Error('Sonda Auth non eliminata');}
            catch(e){if(e.code!=='auth/user-not-found')throw e;}
            console.log('Exact verificato: sonde Firestore/Auth eliminate.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          test -f "${RUNNER_TEMP}/hosting-restored/hosting-manifest.json"
          test -d "${RUNNER_TEMP}/hosting-restored/hosting"
          test -d "${RUNNER_TEMP}/hosting-restored/app-config"

      - name: Riepilogo
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "TEST E2E OK: ${{ steps.backup.outputs.name }} -> ${TEST_PROJECT_ID}"
          echo 'Verificati: decrypt, Firestore exact, logs, Auth replace, sonde extra eliminate, rilettura e Hosting deploy.'

      - name: Segnala test non eseguito
        if: steps.gate.outputs.enabled != 'true'
        run: echo 'TEST E2E NON ESEGUITO: progetto Firebase test non abilitato.'
