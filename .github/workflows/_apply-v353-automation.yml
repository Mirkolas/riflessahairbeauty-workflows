name: Applica automazione completa 3.5.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_apply-v353-automation.yml"

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions

jobs:
  patch-test-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout workflow e patch
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Checkout repo privata
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Applica automazioni 3.5.3
        shell: bash
        run: python workflows/scripts/apply-v353-automation.py source

      - name: Imposta versione 3.5.3
        working-directory: source/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"
          if [[ "${CURRENT}" != "3.5.3" ]]; then npm version 3.5.3 --no-git-tag-version; fi

      - name: Installa dipendenze
        working-directory: source/${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Test
        working-directory: source/${{ env.APP_DIR }}
        run: npm test

      - name: Check progetto
        working-directory: source/${{ env.APP_DIR }}
        run: npm run check

      - name: Esporta file testati
        uses: actions/upload-artifact@v4
        with:
          name: registratore-3.5.3-patched
          if-no-files-found: error
          retention-days: 1
          path: |
            source/${{ env.APP_DIR }}/js/app.js
            source/${{ env.APP_DIR }}/index.html
            source/${{ env.APP_DIR }}/electron/main.js
            source/${{ env.APP_DIR }}/package.json
            source/${{ env.APP_DIR }}/package-lock.json
            source/${{ env.APP_DIR }}/tests/automatic-fiscal-closure.test.js
            source/Guida_Riflessa_App_Registratore_3.5.3.txt
