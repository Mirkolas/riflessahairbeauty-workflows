name: Patch registratore journal - una tantum

on:
  push:
    paths:
      - ".github/workflows/patch-registratore-journal-once.yml"

permissions:
  contents: read

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout applicazione privata
        uses: actions/checkout@v4
        with:
          repository: Mirkolas/riflessahairbeauty
          ref: main
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: app-repo
          fetch-depth: 1
          persist-credentials: true

      - name: Attiva journal Firestore
        working-directory: app-repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions")
          base_url = "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"
          wrapper = "./firestore-with-backup-journal.js"

          for rel in ["js/app.js", "js/log-sync.js"]:
              path = root / rel
              text = path.read_text(encoding="utf-8")
              if wrapper in text:
                  continue
              if base_url not in text:
                  raise SystemExit(f"{rel}: import Firestore originale non trovato")
              path.write_text(text.replace(base_url, wrapper, 1), encoding="utf-8")

          rules = root / "firestore.rules"
          text = rules.read_text(encoding="utf-8")
          marker = "    match /registratoreLogFiles/{fileId} {"
          block = """    match /_backupChanges/{id} {\n      allow create: if isStaff()\n        && request.resource.data.schemaVersion == 1\n        && request.resource.data.changes is list\n        && request.resource.data.changes.size() > 0\n        && request.resource.data.changes.size() <= 450;\n      allow read, update, delete: if false;\n    }\n\n"""
          if "match /_backupChanges/{id}" not in text:
              if marker not in text:
                  raise SystemExit("firestore.rules: punto di inserimento journal non trovato")
              text = text.replace(marker, block + marker, 1)
              rules.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/app.js \
            riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/log-sync.js \
            riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/firestore.rules

          if git diff --cached --quiet; then
            echo "Patch già applicata: nessuna modifica da inviare."
          else
            git commit -m "Attiva journal Firestore per backup incrementale"
            git push origin HEAD:main
          fi
