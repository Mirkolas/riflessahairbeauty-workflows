name: Finalizza Cassa servizi-prodotti 3.5.14 una tantum

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-pos-groups-3514-once.yml"
      - "scripts/finalize-pos-groups-3514.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verifica credenziale sorgente
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_PAT" || { echo '::error::PUBLIC_REPO_TOKEN mancante'; exit 1; }

      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout sorgente privato
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Applica separazione Cassa e porta a 3.5.14
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize-pos-groups-3514.py "source/${APP_DIR}"
          cd "source/${APP_DIR}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [[ "$CURRENT" == "3.5.13" ]]; then
            npm version 3.5.14 --no-git-tag-version
          elif [[ "$CURRENT" != "3.5.14" ]]; then
            echo "::error::Versione sorgente inattesa: $CURRENT"
            exit 1
          fi
          test "$(node -p "require('./package.json').version")" = "3.5.14"
          test "$(node -p "require('./package-lock.json').version")" = "3.5.14"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "3.5.14"

      - name: Test completi e preflight
        shell: bash
        working-directory: source/${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run check
          node scripts/release-preflight.cjs

      - name: Verifica modifica limitata alla Cassa
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git diff --check
          CHANGED="$(git status --short | awk '{print $2}')"
          printf '%s\n' "$CHANGED"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              "${APP_DIR}/js/app.js"|"${APP_DIR}/ui-v3513.css"|"${APP_DIR}/tests/pos-product-groups.test.js"|"${APP_DIR}/VERSIONE_3_5_14_CASSA_GRUPPI.txt"|"${APP_DIR}/package.json"|"${APP_DIR}/package-lock.json") ;;
              *) echo "::error::File inatteso modificato: $file"; exit 1 ;;
            esac
          done <<< "$CHANGED"
          grep -Fq 'renderSection("Servizi", services, "services")' "${APP_DIR}/js/app.js"
          grep -Fq 'renderSection("Prodotti", products, "products")' "${APP_DIR}/js/app.js"
          grep -Fq 'const priceDiff = Number(a.priceCents || 0) - Number(b.priceCents || 0);' "${APP_DIR}/js/app.js"

      - name: Pubblica sorgente 3.5.14
        shell: bash
        run: |
          set -euo pipefail
          cd source
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo 'Nessuna modifica da pubblicare.'
          else
            git config user.name 'Riflessa Release Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add "${APP_DIR}/js/app.js" "${APP_DIR}/ui-v3513.css" "${APP_DIR}/tests/pos-product-groups.test.js" "${APP_DIR}/VERSIONE_3_5_14_CASSA_GRUPPI.txt" "${APP_DIR}/package.json" "${APP_DIR}/package-lock.json"
            git commit -m 'Separa servizi e prodotti in Cassa 3.5.14'
            git push "https://x-access-token:${SOURCE_PAT}@github.com/${SOURCE_REPOSITORY}.git" HEAD:main
          fi

      - name: Avvia build firmata privata 3.5.14
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-exe-registratore.yml --repo "$GITHUB_REPOSITORY"
