name: Crea Firebase Storage privato una tantum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-storage-once.yml'

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      BUCKET_LOCATION: europe-west8
    steps:
      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          test -n "$GOOGLE_CREDENTIALS_JSON"

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Crea o verifica default bucket Firebase
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          GET_URL="https://firebasestorage.googleapis.com/v1alpha/projects/$PROJECT_ID/defaultBucket"
          CODE="$(curl -sS -o "$RUNNER_TEMP/default-bucket-get.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$GET_URL")"
          if [[ "$CODE" == '200' ]]; then
            echo 'Default bucket già esistente:'
            jq '{name,location,bucket}' "$RUNNER_TEMP/default-bucket-get.json"
          elif [[ "$CODE" == '404' ]]; then
            jq -n --arg location "$BUCKET_LOCATION" '{location:$location}' > "$RUNNER_TEMP/default-bucket-create.json"
            CREATE_CODE="$(curl -sS -o "$RUNNER_TEMP/default-bucket-create-response.json" -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -X POST \
              -d @"$RUNNER_TEMP/default-bucket-create.json" \
              "https://firebasestorage.googleapis.com/v1alpha/projects/$PROJECT_ID/defaultBucket")"
            cat "$RUNNER_TEMP/default-bucket-create-response.json"
            if [[ "$CREATE_CODE" != '200' && "$CREATE_CODE" != '201' ]]; then
              echo "::error::Creazione default bucket fallita HTTP $CREATE_CODE"
              exit 1
            fi
          else
            cat "$RUNNER_TEMP/default-bucket-get.json"
            echo "::error::Verifica default bucket fallita HTTP $CODE"
            exit 1
          fi

      - name: Verifica bucket fisico
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage buckets describe "gs://$PROJECT_ID.firebasestorage.app" --format='yaml(name,location,storageClass)'
