name: Avvia backup completo registratore una volta

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_run-backup-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia backup definitivo
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'firebase-backup-registratore.yml',
              ref: 'main'
            });
            console.log('Backup completo registratore avviato.');
