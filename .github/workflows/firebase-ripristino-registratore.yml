name: Firebase ripristino - registratore

on:
  workflow_dispatch:
    inputs:
      backup_name:
        description: "Nome cartella backup (es. backup-20260912-120000); vuoto = usa il piu recente"
        required: false
        default: ""
        type: string
      conferma:
        description: "Scrivi RIPRISTINA per confermare"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-ripristino-registratore
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  BACKUP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  restore:
    name: Ripristino Firestore registratore
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Verifica conferma e configurazione
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.conferma }}
        run: |
          set -euo pipefail
          [[ "${CONFIRMATION}" == "RIPRISTINA" ]] || { echo "::error::Conferma non valida. Scrivere esattamente RIPRISTINA."; exit 1; }
          [[ -n "${PROJECT_ID}" ]] || { echo "::error::Manca la Variable FIREBASE_PROJECT_ID."; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo "::error::Manca il Secret FIREBASE_SERVICE_ACCOUNT."; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo "::error::Manca il Secret PUBLIC_REPO_TOKEN nella repository riflessahairbeauty-workflows."; exit 1; }

      - name: Checkout repo privata backup
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Seleziona backup dalla repo privata
        id: backup
        working-directory: backup-repo
        shell: bash
        env:
          REQUESTED_BACKUP: ${{ inputs.backup_name }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_BACKUP}" ]]; then
            [[ "${REQUESTED_BACKUP}" =~ ^backup-[0-9]{8}-[0-9]{6}$ ]] || { echo "::error::Nome backup non valido."; exit 1; }
            BACKUP_NAME="${REQUESTED_BACKUP}"
          else
            BACKUP_NAME="$(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' -printf '%f\n' 2>/dev/null | sort | tail -n 1)"
          fi

          [[ -n "${BACKUP_NAME}" ]] || { echo "::error::Nessun backup disponibile in backup-registratore/."; exit 1; }
          BACKUP_PATH="backup-registratore/${BACKUP_NAME}"
          BACKUP_FILE="${BACKUP_PATH}/firestore.json"
          [[ -f "${BACKUP_FILE}" ]] || { echo "::error::Backup Firestore JSON non trovato."; exit 1; }

          node -e "const b=require(process.argv[1]); if(b.format!=='riflessa-firestore-json-v1'||!Array.isArray(b.documents)) process.exit(1); console.log('Backup valido:', b.documentCount, 'documenti');" "${BACKUP_FILE}"

          echo "name=${BACKUP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "file=${BACKUP_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa Firebase Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firestore-restore-tool"
          cd "${RUNNER_TEMP}/firestore-restore-tool"
          npm init -y >/dev/null 2>&1
          npm install firebase-admin@13 --no-audit --no-fund

      - name: Prepara ripristino Firestore
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/firestore-restore-tool/restore.cjs" <<'NODE'
          const fs = require('fs');
          const admin = require('firebase-admin');

          const credentials = JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);
          admin.initializeApp({
            credential: admin.credential.cert(credentials),
            projectId: process.env.PROJECT_ID,
          });
          const db = admin.firestore();

          function decode(value) {
            if (value === null || value === undefined) return value;
            if (Array.isArray(value)) return value.map(decode);
            if (typeof value !== 'object') return value;

            if (value.__firestoreType === 'timestamp') {
              return new admin.firestore.Timestamp(value.seconds, value.nanoseconds);
            }
            if (value.__firestoreType === 'geopoint') {
              return new admin.firestore.GeoPoint(value.latitude, value.longitude);
            }
            if (value.__firestoreType === 'reference') {
              return db.doc(value.path);
            }
            if (value.__firestoreType === 'bytes') {
              return Buffer.from(value.base64, 'base64');
            }

            const result = {};
            for (const [key, child] of Object.entries(value)) result[key] = decode(child);
            return result;
          }

          async function main() {
            const backup = JSON.parse(fs.readFileSync(process.env.BACKUP_FILE, 'utf8'));
            if (backup.format !== 'riflessa-firestore-json-v1' || !Array.isArray(backup.documents)) {
              throw new Error('Formato backup non valido');
            }
            if (backup.projectId && backup.projectId !== process.env.PROJECT_ID) {
              throw new Error(`Backup del progetto ${backup.projectId}, progetto corrente ${process.env.PROJECT_ID}`);
            }

            let batch = db.batch();
            let pending = 0;
            let restored = 0;

            for (const document of backup.documents) {
              if (!document.path || !document.data) throw new Error('Documento backup non valido');
              batch.set(db.doc(document.path), decode(document.data), { merge: false });
              pending += 1;
              restored += 1;

              if (pending >= 400) {
                await batch.commit();
                batch = db.batch();
                pending = 0;
              }
            }

            if (pending > 0) await batch.commit();
            console.log(`Ripristinati ${restored} documenti Firestore.`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Ripristina Firestore dal backup
        working-directory: backup-repo
        shell: bash
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.file }}
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/firestore-restore-tool/restore.cjs"

      - name: Riepilogo
        shell: bash
        run: echo "Ripristino registratore completato dal backup ${{ steps.backup.outputs.name }}."
