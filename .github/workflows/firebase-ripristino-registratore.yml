name: Firebase ripristino - registratore

on:
  workflow_dispatch:
    inputs:
      backup_name:
        description: "Nome cartella backup; vuoto = usa il piu recente"
        required: false
        default: ""
        type: string
      firestore_mode:
        description: "Firestore: exact riporta i dati esattamente al backup; merge mantiene documenti extra presenti oggi"
        required: true
        default: "exact"
        type: choice
        options:
          - exact
          - merge
      auth_mode:
        description: "Authentication: merge aggiorna/esporta mancanti; replace cancella gli account correnti e ripristina esattamente il backup"
        required: true
        default: "replace"
        type: choice
        options:
          - replace
          - merge
      conferma:
        description: "Scrivi RIPRISTINA per confermare"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-backup-registratore
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  BACKUP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}

jobs:
  restore:
    name: Ripristino completo registratore
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Verifica conferma e configurazione
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.conferma }}
        run: |
          set -euo pipefail
          [[ "${CONFIRMATION}" == "RIPRISTINA" ]] || { echo "::error::Conferma non valida. Scrivere esattamente RIPRISTINA."; exit 1; }
          [[ -n "${PROJECT_ID}" ]] || { echo "::error::Manca FIREBASE_PROJECT_ID."; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo "::error::Manca FIREBASE_SERVICE_ACCOUNT."; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo "::error::Manca PUBLIC_REPO_TOKEN."; exit 1; }
          [[ -n "${AUTH_HASH_CONFIG}" ]] || { echo "::error::Manca FIREBASE_AUTH_HASH_CONFIG."; exit 1; }

      - name: Checkout workflow e script
        uses: actions/checkout@v4
        with:
          path: workflow-src
          persist-credentials: false

      - name: Checkout repo privata backup
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Seleziona backup
        id: backup
        working-directory: backup-repo
        shell: bash
        env:
          REQUESTED_BACKUP: ${{ inputs.backup_name }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_BACKUP}" ]]; then
            [[ "${REQUESTED_BACKUP}" =~ ^backup-[0-9]{8}-[0-9]{6}$ ]] || { echo "::error::Nome backup non valido."; exit 1; }
            BACKUP_NAME="${REQUESTED_BACKUP}"
          else
            BACKUP_NAME="$(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' -printf '%f\n' 2>/dev/null | sort | tail -n 1)"
          fi
          [[ -n "${BACKUP_NAME}" ]] || { echo "::error::Nessun backup disponibile."; exit 1; }
          BACKUP_PATH="backup-registratore/${BACKUP_NAME}"
          [[ -d "${BACKUP_PATH}" ]] || { echo "::error::Cartella backup inesistente."; exit 1; }

          FORMAT=""
          if [[ -f "${BACKUP_PATH}/manifest.json" ]]; then
            FORMAT="$(node -e "const m=require('./${BACKUP_PATH}/manifest.json'); if(m.format==='riflessa-registratore-encrypted-v3')process.stdout.write('v3'); else if(m.format==='riflessa-registratore-backup-v2')process.stdout.write('v2');")"
          elif [[ -f "${BACKUP_PATH}/firestore.json" ]]; then
            FORMAT="v1"
          fi
          [[ -n "${FORMAT}" ]] || { echo "::error::Formato backup non riconosciuto."; exit 1; }
          if [[ "${FORMAT}" == "v3" ]]; then [[ -f "${BACKUP_PATH}/backup.enc" ]] || { echo "::error::Archivio cifrato v3 assente."; exit 1; }; fi
          if [[ "${FORMAT}" == "v2" ]]; then [[ -f "${BACKUP_PATH}/firestore/manifest.json" && -f "${BACKUP_PATH}/authentication.enc.json" ]] || { echo "::error::Backup v2 incompleto."; exit 1; }; fi

          echo "name=${BACKUP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "path=${BACKUP_PATH}" >> "${GITHUB_OUTPUT}"
          echo "format=${FORMAT}" >> "${GITHUB_OUTPUT}"

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa Firebase Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/registratore-restore-tool"
          npm install --prefix "${RUNNER_TEMP}/registratore-restore-tool" firebase-admin@13 --no-audit --no-fund >/dev/null

      - name: Verifica backup prima del ripristino
        if: steps.backup.outputs.format != 'v1'
        working-directory: backup-repo
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_PATH="${{ steps.backup.outputs.path }}" node "${GITHUB_WORKSPACE}/workflow-src/scripts/verifica-backup-registratore.cjs"

      - name: Ripristina e rileggi Firestore e Authentication
        working-directory: backup-repo
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/registratore-restore-tool/node_modules
          BACKUP_PATH: ${{ steps.backup.outputs.path }}
          BACKUP_FORMAT: ${{ steps.backup.outputs.format }}
          FIRESTORE_MODE: ${{ inputs.firestore_mode }}
          AUTH_MODE: ${{ inputs.auth_mode }}
          VERIFY_RESTORE: "1"
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE}/workflow-src/scripts/ripristino-registratore.cjs"

      - name: Riepilogo
        shell: bash
        run: |
          echo "Ripristino completato e riletto dal backup ${{ steps.backup.outputs.name }}."
          echo "Formato: ${{ steps.backup.outputs.format }}"
          echo "Firestore: ${{ inputs.firestore_mode }}"
          echo "Authentication: ${{ inputs.auth_mode }}"
          echo "Nota: _backupChanges e escluso dal restore exact perche e infrastruttura del backup incrementale."
