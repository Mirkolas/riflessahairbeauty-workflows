name: Firebase ripristino - registratore

on:
  workflow_dispatch:
    inputs:
      backup_name:
        description: "Nome cartella backup (es. backup-20260912-120000); vuoto = usa il piu recente"
        required: false
        default: ""
        type: string
      conferma:
        description: "Scrivi RIPRISTINA per confermare"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-ripristino-registratore
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || vars.GCP_PROJECT_ID || 'riflessa-15a20' }}
  DATABASE_ID: "(default)"
  BACKUP_BUCKET: ${{ vars.FIRESTORE_BACKUP_BUCKET || vars.BACKUP_BUCKET || 'riflessa-15a20-firestore-backups' }}
  BACKUP_REPOSITORY: ${{ vars.APP_REPOSITORY || 'Mirkolas/riflessahairbeauty' }}
  SOURCE_PAT: ${{ secrets.RIFLESSA_PAT || secrets.REPO_PAT || secrets.GH_PAT || secrets.PAT }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RIFLESSA_15A20 || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_CREDENTIALS || secrets.GOOGLE_CREDENTIALS }}

jobs:
  restore:
    name: Ripristino Firestore registratore
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Verifica conferma e configurazione
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.conferma }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRMATION}" != "RIPRISTINA" ]]; then
            echo "::error::Conferma non valida. Scrivere esattamente RIPRISTINA."
            exit 1
          fi
          if [[ -z "${GOOGLE_CREDENTIALS_JSON}" ]]; then
            echo "::error::Manca il secret con le credenziali Google/Firebase."
            exit 1
          fi
          if [[ -z "${SOURCE_PAT}" ]]; then
            echo "::error::Manca il PAT per leggere la repo privata dei backup."
            exit 1
          fi

      - name: Checkout repo privata backup
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Seleziona backup dalla repo privata
        id: backup
        working-directory: backup-repo
        shell: bash
        env:
          REQUESTED_BACKUP: ${{ inputs.backup_name }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_BACKUP}" ]]; then
            if [[ ! "${REQUESTED_BACKUP}" =~ ^backup-[0-9]{8}-[0-9]{6}$ ]]; then
              echo "::error::Nome backup non valido."
              exit 1
            fi
            BACKUP_NAME="${REQUESTED_BACKUP}"
          else
            BACKUP_NAME="$(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' -printf '%f\n' 2>/dev/null | sort | tail -n 1)"
          fi

          if [[ -z "${BACKUP_NAME}" ]]; then
            echo "::error::Nessun backup disponibile in backup-registratore/."
            exit 1
          fi

          BACKUP_PATH="backup-registratore/${BACKUP_NAME}"
          if [[ ! -d "${BACKUP_PATH}" ]]; then
            echo "::error::Backup ${BACKUP_NAME} non trovato nella repo privata."
            exit 1
          fi

          if [[ ! -f "${BACKUP_PATH}/${BACKUP_NAME}.overall_export_metadata" ]]; then
            echo "::error::Backup Firestore incompleto o nome metadata non coerente."
            exit 1
          fi

          echo "name=${BACKUP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "path=${BACKUP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Installa Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Prepara bucket temporaneo restore
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${PROJECT_ID}" --quiet

          if ! gcloud storage buckets describe "gs://${BACKUP_BUCKET}" >/dev/null 2>&1; then
            DB_LOCATION="$(gcloud firestore databases describe \
              --database="${DATABASE_ID}" \
              --project="${PROJECT_ID}" \
              --format='value(locationId)')"

            case "${DB_LOCATION}" in
              nam5) BUCKET_LOCATION="US" ;;
              eur3) BUCKET_LOCATION="EU" ;;
              *)    BUCKET_LOCATION="${DB_LOCATION}" ;;
            esac

            gcloud storage buckets create "gs://${BACKUP_BUCKET}" \
              --project="${PROJECT_ID}" \
              --location="${BUCKET_LOCATION}" \
              --uniform-bucket-level-access
          fi

      - name: Carica backup nel bucket temporaneo
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          RESTORE_URI="gs://${BACKUP_BUCKET}/registratore/restore/${GITHUB_RUN_ID}/${{ steps.backup.outputs.name }}"
          gcloud storage rsync \
            "backup-repo/${{ steps.backup.outputs.path }}" \
            "${RESTORE_URI}" \
            --recursive
          echo "uri=${RESTORE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Ripristina Firestore dal backup
        shell: bash
        run: |
          set -euo pipefail
          echo "Avvio ripristino Firestore registratore dal backup ${{ steps.backup.outputs.name }}."
          gcloud firestore import "${{ steps.upload.outputs.uri }}" \
            --database="${DATABASE_ID}" \
            --project="${PROJECT_ID}" \
            --quiet

      - name: Pulisci copia temporanea
        if: always() && steps.upload.outputs.uri != ''
        shell: bash
        run: gcloud storage rm --recursive "${{ steps.upload.outputs.uri }}" || true

      - name: Riepilogo
        shell: bash
        run: echo "Ripristino registratore completato dal backup ${{ steps.backup.outputs.name }}."
