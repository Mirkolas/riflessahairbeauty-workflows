name: Forza build Windows journal - una tantum

on:
  push:
    paths:
      - ".github/workflows/trigger-build-journal-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Avvia build registratore forzata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-exe-registratore.yml --repo Mirkolas/riflessahairbeauty-workflows --ref main
