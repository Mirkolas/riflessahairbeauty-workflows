name: Avvia build 3.5.12 una tantum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-build-3512-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia workflow permanente registratore
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-exe-registratore.yml --repo Mirkolas/riflessahairbeauty-workflows --ref main
