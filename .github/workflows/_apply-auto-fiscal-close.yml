name: Applica chiusura fiscale automatica

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_apply-auto-fiscal-close.yml"

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo privata
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: true
          fetch-depth: 0

      - name: Applica modifica e testa
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          cd "source/${{ env.APP_DIR }}"
          npm version 3.5.3 --no-git-tag-version
          npm install --no-audit --no-fund
          npm test
          npm run check

      - name: Commit e push privato
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automatizza registrazione chiusura fiscale 3.5.3"
          git push origin HEAD:main
