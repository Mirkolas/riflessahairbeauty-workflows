name: Rimuovi release pubbliche registratore una tantum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-public-releases-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica che 3.5.10 sia nella repo privata
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PRIVATE_REPO: Mirkolas/riflessahairbeauty
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN" || { echo '::error::PUBLIC_REPO_TOKEN mancante'; exit 1; }
          assets="$(GH_TOKEN="$PRIVATE_TOKEN" gh release view registratore-v3.5.10 --repo "$PRIVATE_REPO" --json assets --jq '.assets[].name')"
          printf '%s\n' "$assets" | grep -Fxq 'riflessa-app-3.5.10.exe' || {
            echo '::error::Release privata registratore-v3.5.10 non verificata'; exit 1;
          }
          echo 'Release privata 3.5.10 verificata.'

      - name: Elimina tutte le release versionate dalla repo pubblica
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')
          echo "Release pubbliche trovate: ${#tags[@]}"
          for tag in "${tags[@]}"; do
            if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Elimino release pubblica $tag e relativo tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            else
              echo "Ignoro release non-versione: $tag"
            fi
          done

      - name: Verifica che non restino versioni pubbliche
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [[ -n "$remaining" ]]; then
            echo '::error::Sono rimaste release versionate pubbliche:'
            echo "$remaining"
            exit 1
          fi
          echo 'Nessuna release versionata pubblica rimasta.'
