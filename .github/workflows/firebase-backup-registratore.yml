name: Firebase backup - registratore

on:
  schedule:
    # GitHub cron usa UTC. I due orari coprono ora legale/solare italiana;
    # il primo step esegue davvero il backup solo quando Europe/Rome e domenica ore 00.
    - cron: "0 22 * * 6"
    - cron: "0 23 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backup-registratore
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  BACKUP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}

jobs:
  backup:
    name: Backup registratore
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Verifica orario backup Italia
        id: schedule_gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "Avvio manuale autorizzato."
            exit 0
          fi

          LOCAL_DAY="$(TZ=Europe/Rome date +%u)"
          LOCAL_HOUR="$(TZ=Europe/Rome date +%H)"
          LOCAL_NOW="$(TZ=Europe/Rome date +'%Y-%m-%d %H:%M:%S %Z')"
          echo "Ora italiana: ${LOCAL_NOW}"

          if [[ "${LOCAL_DAY}" == "7" && "${LOCAL_HOUR}" == "00" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "E domenica a mezzanotte in Italia: eseguo il backup."
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "Questo e il passaggio UTC non corrispondente alla mezzanotte italiana: nessun backup."
          fi

      - name: Verifica configurazione protetta
        if: steps.schedule_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PROJECT_ID}" ]] || { echo "::error::Manca FIREBASE_PROJECT_ID."; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo "::error::Manca FIREBASE_SERVICE_ACCOUNT."; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo "::error::Manca PUBLIC_REPO_TOKEN."; exit 1; }
          [[ -n "${AUTH_HASH_CONFIG}" ]] || { echo "::error::Manca FIREBASE_AUTH_HASH_CONFIG."; exit 1; }

      - name: Checkout workflow e script
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          path: workflow-src
          persist-credentials: false

      - name: Checkout repo privata backup
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 0
          persist-credentials: true

      - name: Configura Node.js
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa Firebase Admin SDK
        if: steps.schedule_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/registratore-backup-tool"
          npm install --prefix "${RUNNER_TEMP}/registratore-backup-tool" firebase-admin@13 --no-audit --no-fund >/dev/null

      - name: Crea backup con massimo 5 tentativi
        if: steps.schedule_gate.outputs.run == 'true'
        id: backup
        working-directory: backup-repo
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/registratore-backup-tool/node_modules
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SUCCESS=0
          FINAL_BACKUP=""
          FINAL_MODE=""
          APP_DIR="riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions"
          EXPORTER="${GITHUB_WORKSPACE}/workflow-src/scripts/backup-registratore.cjs"

          for ATTEMPT in 1 2 3 4 5; do
            echo "Tentativo backup ${ATTEMPT}/5"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -- backup-registratore

            PREVIOUS_BACKUP_DIR="$(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' | sort | tail -n 1)"
            PREVIOUS_BACKUP_NAME=""
            PREVIOUS_BACKUP_ABS=""
            if [[ -n "${PREVIOUS_BACKUP_DIR}" ]]; then
              PREVIOUS_BACKUP_NAME="$(basename "${PREVIOUS_BACKUP_DIR}")"
              PREVIOUS_BACKUP_ABS="${PWD}/${PREVIOUS_BACKUP_DIR}"
              echo "Base precedente: ${PREVIOUS_BACKUP_NAME}"
            else
              echo "Nessuna base precedente: il backup sara completo."
            fi

            SOURCE_COMMIT="$(git rev-parse HEAD)"
            TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
            BACKUP_NAME="backup-${TIMESTAMP}"
            LOCAL_DIR="backup-registratore/${BACKUP_NAME}"
            mkdir -p "${LOCAL_DIR}/app-config/config" "${LOCAL_DIR}/app-config/js"

            if OUTPUT_DIR="${PWD}/${LOCAL_DIR}" \
              SOURCE_COMMIT="${SOURCE_COMMIT}" \
              PREVIOUS_BACKUP_DIR="${PREVIOUS_BACKUP_ABS}" \
              PREVIOUS_BACKUP_NAME="${PREVIOUS_BACKUP_NAME}" \
              node "${EXPORTER}"; then

              cp "${APP_DIR}/.firebaserc" "${LOCAL_DIR}/app-config/.firebaserc"
              cp "${APP_DIR}/firebase.json" "${LOCAL_DIR}/app-config/firebase.json"
              cp "${APP_DIR}/firestore.rules" "${LOCAL_DIR}/app-config/firestore.rules"
              cp "${APP_DIR}/package.json" "${LOCAL_DIR}/app-config/package.json"
              cp "${APP_DIR}/config/default-axon-profile.json" "${LOCAL_DIR}/app-config/config/default-axon-profile.json"
              cp "${APP_DIR}/js/firebase-config.js" "${LOCAL_DIR}/app-config/js/firebase-config.js"
              printf '%s\n' "${SOURCE_COMMIT}" > "${LOCAL_DIR}/SOURCE_COMMIT.txt"

              if node -e "const m=require('./${LOCAL_DIR}/manifest.json'); if(m.format!=='riflessa-registratore-backup-v2'||m.firestore?.documentCount===undefined||!m.firestore?.journalCursor||m.authentication?.accountCount===undefined) process.exit(1); console.log('Manifest backup verificato:',m.firestore.backupMode);" \
                && node -e "const a=require('./${LOCAL_DIR}/authentication.enc.json'); if(a.format!=='riflessa-firebase-auth-aes256gcm-v1'||!a.ciphertext||!a.authTag) process.exit(1); console.log('Authentication cifrata verificata.');" \
                && test -f "${LOCAL_DIR}/firestore/manifest.json"; then

                BACKUP_MODE="$(node -p "require('./${LOCAL_DIR}/manifest.json').firestore.backupMode || 'full'")"
                JOURNAL_READS="$(node -p "require('./${LOCAL_DIR}/manifest.json').firestore.journalDocumentsRead || 0")"
                CHANGED_PATHS="$(node -p "require('./${LOCAL_DIR}/manifest.json').firestore.changedPaths || 0")"

                cat > "${LOCAL_DIR}/BACKUP_INFO.txt" <<EOF
          Backup registratore
          Data UTC: ${TIMESTAMP}
          Progetto: ${PROJECT_ID}
          Commit applicazione: ${SOURCE_COMMIT}
          Modalita Firestore: ${BACKUP_MODE}
          Base precedente: ${PREVIOUS_BACKUP_NAME:-nessuna}
          Record journal letti: ${JOURNAL_READS}
          Documenti/path modificati verificati: ${CHANGED_PATHS}
          Contenuto finale: snapshot Firestore completo e autonomo, Authentication cifrata con hash password, log registratore sincronizzati, configurazione applicazione.
          Tentativo riuscito: ${ATTEMPT}/5
          EOF

                mapfile -t BACKUPS < <(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' | sort)
                COUNT="${#BACKUPS[@]}"
                if (( COUNT > 5 )); then
                  REMOVE_COUNT=$((COUNT - 5))
                  echo "Retention: mantengo gli ultimi 5 backup e rimuovo ${REMOVE_COUNT} backup piu vecchi."
                  for ((I=0; I<REMOVE_COUNT; I++)); do
                    rm -rf -- "${BACKUPS[$I]}"
                  done
                fi

                git add backup-registratore
                git commit -m "Backup registratore ${TIMESTAMP} (${BACKUP_MODE}, tentativo ${ATTEMPT})"
                if git push origin HEAD:main; then
                  SUCCESS=1
                  FINAL_BACKUP="${BACKUP_NAME}"
                  FINAL_MODE="${BACKUP_MODE}"
                  echo "Backup creato: backup-registratore/${BACKUP_NAME} (${BACKUP_MODE})"
                  break
                fi
              fi
            fi

            echo "::warning::Tentativo ${ATTEMPT}/5 non riuscito."
            git reset --hard origin/main >/dev/null 2>&1 || true
            git clean -fd -- backup-registratore >/dev/null 2>&1 || true
            if (( ATTEMPT < 5 )); then sleep $((ATTEMPT * 15)); fi
          done

          if (( SUCCESS != 1 )); then
            echo "::error::Backup non creato dopo 5 tentativi."
            exit 1
          fi

          echo "backup_name=${FINAL_BACKUP}" >> "${GITHUB_OUTPUT}"
          echo "backup_mode=${FINAL_MODE}" >> "${GITHUB_OUTPUT}"

      - name: Riepilogo
        if: steps.schedule_gate.outputs.run == 'true'
        shell: bash
        run: |
          echo "Backup registratore riuscito."
          echo "Modalita: ${{ steps.backup.outputs.backup_mode }}"
          echo "Percorso: backup-registratore/${{ steps.backup.outputs.backup_name }}"
