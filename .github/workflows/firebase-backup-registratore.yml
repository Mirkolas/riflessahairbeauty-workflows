name: Firebase backup - registratore

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backup-registratore
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  DATABASE_ID: "(default)"
  BACKUP_BUCKET: ${{ vars.FIREBASE_PROJECT_ID }}-firestore-backups
  BACKUP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  backup:
    name: Backup Firestore registratore
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Verifica configurazione protetta
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PROJECT_ID}" ]] || { echo "::error::Manca la Variable FIREBASE_PROJECT_ID."; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo "::error::Manca il Secret FIREBASE_SERVICE_ACCOUNT."; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo "::error::Manca il Secret PUBLIC_REPO_TOKEN."; exit 1; }

      - name: Checkout repo privata backup
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 0
          persist-credentials: true

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Installa Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Prepara bucket temporaneo
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${PROJECT_ID}" --quiet

          if ! gcloud storage buckets describe "gs://${BACKUP_BUCKET}" >/dev/null 2>&1; then
            DB_LOCATION="$(gcloud firestore databases describe \
              --database="${DATABASE_ID}" \
              --project="${PROJECT_ID}" \
              --format='value(locationId)')"

            case "${DB_LOCATION}" in
              nam5) BUCKET_LOCATION="US" ;;
              eur3) BUCKET_LOCATION="EU" ;;
              *) BUCKET_LOCATION="${DB_LOCATION}" ;;
            esac

            gcloud storage buckets create "gs://${BACKUP_BUCKET}" \
              --project="${PROJECT_ID}" \
              --location="${BUCKET_LOCATION}" \
              --uniform-bucket-level-access
          fi

      - name: Crea backup con massimo 5 tentativi
        id: backup
        working-directory: backup-repo
        shell: bash
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SUCCESS=0
          FINAL_BACKUP=""

          for ATTEMPT in 1 2 3 4 5; do
            echo "Tentativo backup ${ATTEMPT}/5"

            git fetch origin main
            git reset --hard origin/main
            git clean -fd -- backup-registratore

            TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
            BACKUP_NAME="backup-${TIMESTAMP}"
            LOCAL_DIR="backup-registratore/${BACKUP_NAME}"
            GCS_DIR="gs://${BACKUP_BUCKET}/registratore/staging/${BACKUP_NAME}"

            mkdir -p "${LOCAL_DIR}"

            if gcloud firestore export "${GCS_DIR}" \
              --database="${DATABASE_ID}" \
              --project="${PROJECT_ID}" \
              --quiet \
              && gcloud storage rsync "${GCS_DIR}" "${LOCAL_DIR}" --recursive \
              && [[ -f "${LOCAL_DIR}/${BACKUP_NAME}.overall_export_metadata" ]]; then

              mapfile -t BACKUPS < <(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' | sort)
              COUNT="${#BACKUPS[@]}"
              echo "Backup presenti dopo la creazione: ${COUNT}"

              if (( COUNT >= 5 )); then
                echo "Soglia 5 raggiunta: elimino i precedenti e mantengo solo ${BACKUP_NAME}."
                for DIR in "${BACKUPS[@]}"; do
                  if [[ "${DIR}" != "${LOCAL_DIR}" ]]; then
                    rm -rf -- "${DIR}"
                  fi
                done
              fi

              git add backup-registratore
              git commit -m "Backup registratore ${TIMESTAMP} (tentativo ${ATTEMPT})"

              if git push origin HEAD:main; then
                SUCCESS=1
                FINAL_BACKUP="${BACKUP_NAME}"
                gcloud storage rm --recursive "${GCS_DIR}" >/dev/null 2>&1 || true
                echo "Backup creato con successo nella repo privata: backup-registratore/${BACKUP_NAME}"
                break
              fi
            fi

            echo "::warning::Tentativo ${ATTEMPT}/5 non riuscito."
            gcloud storage rm --recursive "${GCS_DIR}" >/dev/null 2>&1 || true
            git reset --hard origin/main >/dev/null 2>&1 || true
            git clean -fd -- backup-registratore >/dev/null 2>&1 || true

            if (( ATTEMPT < 5 )); then
              sleep $((ATTEMPT * 15))
            fi
          done

          if (( SUCCESS != 1 )); then
            echo "::error::Backup non creato dopo 5 tentativi."
            exit 1
          fi

          echo "backup_name=${FINAL_BACKUP}" >> "${GITHUB_OUTPUT}"

      - name: Riepilogo
        shell: bash
        run: |
          echo "Backup registratore completato nella repo privata."
          echo "Percorso: backup-registratore/${{ steps.backup.outputs.backup_name }}"
