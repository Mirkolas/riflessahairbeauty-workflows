name: Firebase backup - registratore

on:
  schedule:
    # GitHub cron usa UTC. I due orari coprono ora legale/solare italiana.
    # Il gate valuta l'ORARIO PIANIFICATO (non quello reale del runner, che GitHub puo ritardare).
    - cron: "0 22 * * 6"
    - cron: "0 23 * * 6"
  # Una modifica a questo workflow forza un backup di recupero immediato.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/firebase-backup-registratore.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backup-registratore
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  BACKUP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}

jobs:
  backup:
    name: Backup registratore checkpoint/resume persistente
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Verifica orario backup Italia
        id: schedule_gate
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "Avvio ${GITHUB_EVENT_NAME} autorizzato."
            exit 0
          fi

          [[ "${GITHUB_EVENT_NAME}" == "schedule" ]] || {
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "Evento non previsto: nessun backup."
            exit 0
          }

          # GitHub Actions puo avviare i cron anche con forte ritardo. Per questo NON
          # controlliamo l'ora reale del runner: ricostruiamo l'istante previsto dal cron.
          UTC_DOW="$(date -u +%u)"
          if [[ "${UTC_DOW}" == "6" ]]; then
            SCHEDULE_DATE="$(date -u +%F)"
          elif [[ "${UTC_DOW}" == "7" ]]; then
            SCHEDULE_DATE="$(date -u -d 'yesterday' +%F)"
          else
            SCHEDULE_DATE="$(date -u -d 'last saturday' +%F)"
          fi

          CRON_HOUR="$(awk '{print $2}' <<< "${SCHEDULE_CRON}")"
          [[ "${CRON_HOUR}" =~ ^(22|23)$ ]] || {
            echo "::error::Cron inatteso: ${SCHEDULE_CRON}"
            exit 1
          }

          SCHEDULED_UTC="${SCHEDULE_DATE} ${CRON_HOUR}:00:00 UTC"
          LOCAL_DAY="$(TZ=Europe/Rome date -d "${SCHEDULED_UTC}" +%u)"
          LOCAL_HOUR="$(TZ=Europe/Rome date -d "${SCHEDULED_UTC}" +%H)"
          LOCAL_PLANNED="$(TZ=Europe/Rome date -d "${SCHEDULED_UTC}" +'%Y-%m-%d %H:%M:%S %Z')"

          echo "Cron ricevuto: ${SCHEDULE_CRON}"
          echo "Istante pianificato in Italia: ${LOCAL_PLANNED}"
          echo "Istante reale runner: $(TZ=Europe/Rome date +'%Y-%m-%d %H:%M:%S %Z')"

          if [[ "${LOCAL_DAY}" == "7" && "${LOCAL_HOUR}" == "00" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "Questo cron rappresenta la mezzanotte italiana: avvio backup."
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "Questo e il cron gemello per l'altro offset DST: nessun backup."
          fi

      - name: Verifica configurazione protetta
        if: steps.schedule_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PROJECT_ID}" ]] || { echo "::error::Manca FIREBASE_PROJECT_ID."; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo "::error::Manca FIREBASE_SERVICE_ACCOUNT."; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo "::error::Manca PUBLIC_REPO_TOKEN."; exit 1; }
          [[ -n "${AUTH_HASH_CONFIG}" ]] || { echo "::error::Manca FIREBASE_AUTH_HASH_CONFIG."; exit 1; }

      - name: Checkout workflow e script
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          path: workflow-src
          persist-credentials: false

      - name: Checkout repo privata backup
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 0
          persist-credentials: true

      - name: Configura Node.js
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa Firebase Admin SDK
        if: steps.schedule_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/registratore-backup-tool"
          npm install --prefix "${RUNNER_TEMP}/registratore-backup-tool" firebase-admin@13 --no-audit --no-fund >/dev/null

      - name: Crea backup con checkpoint persistente e massimo 4 tentativi
        if: steps.schedule_gate.outputs.run == 'true'
        id: backup
        working-directory: backup-repo
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/registratore-backup-tool/node_modules
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SUCCESS=0
          FINAL_BACKUP=""
          FINAL_MODE=""
          APP_DIR="riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions"
          ORCHESTRATOR="${GITHUB_WORKSPACE}/workflow-src/scripts/backup-registratore-v3.cjs"
          VERIFIER="${GITHUB_WORKSPACE}/workflow-src/scripts/verifica-backup-registratore.cjs"
          JOURNAL_CLEANER="${GITHUB_WORKSPACE}/workflow-src/scripts/pulisci-journal-backup.cjs"
          CHECKPOINT_DIR="${RUNNER_TEMP}/registratore-backup-checkpoint"
          PERSISTENT_CHECKPOINT_DIR="${PWD}/.backup-checkpoints/registratore"
          BACKUP_REPO_DIR="${PWD}"
          RESUME_FILE="${PERSISTENT_CHECKPOINT_DIR}/resume.json"

          rm -rf "${CHECKPOINT_DIR}"
          mkdir -p "${CHECKPOINT_DIR}/source-app"

          if [[ -f "${RESUME_FILE}" ]]; then
            echo "Trovato checkpoint persistente da un workflow precedente."
            BACKUP_NAME="$(node -p "const m=require('${RESUME_FILE}'); if(m.format!=='riflessa-persistent-checkpoint-v1'||m.projectId!==process.env.PROJECT_ID)process.exit(2); m.backupName")" || exit 1
            SOURCE_COMMIT="$(node -p "require('${RESUME_FILE}').sourceCommit")"
            PREVIOUS_BACKUP_NAME="$(node -p "require('${RESUME_FILE}').previousBackupName || ''")"
            [[ "${BACKUP_NAME}" =~ ^backup-[0-9]{8}-[0-9]{6}$ ]] || { echo "::error::Backup name nel checkpoint non valido."; exit 1; }
            [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Source commit nel checkpoint non valido."; exit 1; }
            git cat-file -e "${SOURCE_COMMIT}^{commit}" || { echo "::error::Commit sorgente del checkpoint non disponibile."; exit 1; }
            RUN_TIMESTAMP="${BACKUP_NAME#backup-}"
          else
            SOURCE_COMMIT="$(git rev-parse HEAD)"
            RUN_TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
            BACKUP_NAME="backup-${RUN_TIMESTAMP}"
            PREVIOUS_BACKUP_NAME="$(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' -printf '%f\n' 2>/dev/null | sort | tail -n 1)"
          fi

          PREVIOUS_BACKUP_ABS=""
          if [[ -n "${PREVIOUS_BACKUP_NAME}" ]]; then
            PREVIOUS_BACKUP_ABS="${PWD}/backup-registratore/${PREVIOUS_BACKUP_NAME}"
            [[ -d "${PREVIOUS_BACKUP_ABS}" ]] || { echo "::error::Base precedente ${PREVIOUS_BACKUP_NAME} non disponibile."; exit 1; }
            echo "Base precedente: ${PREVIOUS_BACKUP_NAME}"
          else
            echo "Nessuna base precedente: il backup sara completo."
          fi

          FINAL_DIR="${PWD}/backup-registratore/${BACKUP_NAME}"

          SOURCE_TREE="${RUNNER_TEMP}/registratore-source-tree"
          rm -rf "${SOURCE_TREE}"
          mkdir -p "${SOURCE_TREE}"
          git archive "${SOURCE_COMMIT}" -- "${APP_DIR}" | tar -x -C "${SOURCE_TREE}"
          rsync -a --delete --exclude node_modules --exclude dist "${SOURCE_TREE}/${APP_DIR}/" "${CHECKPOINT_DIR}/source-app/"
          echo "Commit applicazione congelato per il backup: ${SOURCE_COMMIT}"
          echo "Backup in lavorazione: ${BACKUP_NAME}"

          for ATTEMPT in 1 2 3 4; do
            echo "===== Tentativo backup ${ATTEMPT}/4 ====="
            git fetch origin main
            git reset --hard origin/main
            rm -rf "${FINAL_DIR}"

            if CHECKPOINT_DIR="${CHECKPOINT_DIR}" \
              FINAL_DIR="${FINAL_DIR}" \
              PREVIOUS_BACKUP_DIR="${PREVIOUS_BACKUP_ABS}" \
              PREVIOUS_BACKUP_NAME="${PREVIOUS_BACKUP_NAME}" \
              SOURCE_APP_DIR="${CHECKPOINT_DIR}/source-app" \
              SOURCE_COMMIT="${SOURCE_COMMIT}" \
              BACKUP_NAME="${BACKUP_NAME}" \
              ATTEMPT="${ATTEMPT}" \
              BACKUP_REPO_DIR="${BACKUP_REPO_DIR}" \
              PERSISTENT_CHECKPOINT_DIR="${PERSISTENT_CHECKPOINT_DIR}" \
              node "${ORCHESTRATOR}"; then

              if BACKUP_PATH="${FINAL_DIR}" node "${VERIFIER}"; then
                BACKUP_MODE="$(node -p "require('${FINAL_DIR}/manifest.json').backupMode || 'full'")"

                mapfile -t BACKUPS < <(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' | sort)
                COUNT="${#BACKUPS[@]}"
                if (( COUNT > 5 )); then
                  REMOVE_COUNT=$((COUNT - 5))
                  echo "Retention: mantengo gli ultimi 5 backup e rimuovo ${REMOVE_COUNT} backup piu vecchi."
                  for ((I=0; I<REMOVE_COUNT; I++)); do rm -rf -- "${BACKUPS[$I]}"; done
                fi

                # La rimozione del checkpoint persistente e il backup definitivo viaggiano nello stesso commit.
                rm -rf "${PERSISTENT_CHECKPOINT_DIR}"
                git add -A -- backup-registratore .backup-checkpoints
                git commit -m "Backup registratore ${RUN_TIMESTAMP} (${BACKUP_MODE}, checkpoint persistente, tentativo ${ATTEMPT})"
                if git push origin HEAD:main; then
                  SUCCESS=1
                  FINAL_BACKUP="${BACKUP_NAME}"
                  FINAL_MODE="${BACKUP_MODE}"
                  echo "Backup definitivo creato: backup-registratore/${BACKUP_NAME}"

                  JOURNAL_OK=0
                  for JATTEMPT in 1 2 3 4; do
                    echo "Pulizia journal verificato, tentativo ${JATTEMPT}/4"
                    if BACKUP_PATH="${FINAL_DIR}" node "${JOURNAL_CLEANER}"; then JOURNAL_OK=1; break; fi
                    if (( JATTEMPT < 4 )); then sleep 5; fi
                  done
                  if (( JOURNAL_OK != 1 )); then echo "::warning::Backup riuscito ma pulizia _backupChanges non completata; nessuna entry non verificata e stata cancellata."; fi

                  rm -rf "${CHECKPOINT_DIR}"
                  break
                fi
              fi
            fi

            echo "::warning::Tentativo ${ATTEMPT}/4 non riuscito. I checkpoint completati restano cifrati nel repository privato."
            git fetch origin main >/dev/null 2>&1 || true
            git reset --hard origin/main >/dev/null 2>&1 || true
            rm -rf "${FINAL_DIR}"
            if (( ATTEMPT < 4 )); then sleep 5; fi
          done

          if (( SUCCESS != 1 )); then
            echo "::error::Backup domenicale non completato dopo 4 tentativi."
            echo "Il checkpoint cifrato persistente resta nel repository e verra ripreso dal prossimo workflow."
            exit 1
          fi

          echo "backup_name=${FINAL_BACKUP}" >> "${GITHUB_OUTPUT}"
          echo "backup_mode=${FINAL_MODE}" >> "${GITHUB_OUTPUT}"

      - name: Riepilogo
        if: steps.schedule_gate.outputs.run == 'true'
        shell: bash
        run: |
          echo "Backup registratore riuscito."
          echo "Sequenza: Firestore -> checkpoint cifrato persistente -> Auth -> checkpoint -> Hosting -> checkpoint -> Log -> checkpoint -> archivio finale cifrato -> rilettura -> verifica -> push -> pulizia journal verificato."
          echo "Errori Firestore/rete durante l'incrementale causano retry: il full fallback e riservato alla base locale incompatibile/non disponibile."
          echo "Tentativi massimi: 4."
          echo "Modalita: ${{ steps.backup.outputs.backup_mode }}"
          echo "Percorso: backup-registratore/${{ steps.backup.outputs.backup_name }}"
