name: Firebase backup - registratore

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backup-registratore
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  BACKUP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  backup:
    name: Backup Firestore registratore
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Verifica configurazione protetta
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PROJECT_ID}" ]] || { echo "::error::Manca la Variable FIREBASE_PROJECT_ID."; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo "::error::Manca il Secret FIREBASE_SERVICE_ACCOUNT."; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo "::error::Manca il Secret PUBLIC_REPO_TOKEN nella repository riflessahairbeauty-workflows."; exit 1; }

      - name: Checkout repo privata backup
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 0
          persist-credentials: true

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa Firebase Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firestore-backup-tool"
          cd "${RUNNER_TEMP}/firestore-backup-tool"
          npm init -y >/dev/null 2>&1
          npm install firebase-admin@13 --no-audit --no-fund

      - name: Prepara esportatore Firestore
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/firestore-backup-tool/export.cjs" <<'NODE'
          const fs = require('fs');
          const admin = require('firebase-admin');

          const credentials = JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);
          admin.initializeApp({
            credential: admin.credential.cert(credentials),
            projectId: process.env.PROJECT_ID,
          });
          const db = admin.firestore();

          function encode(value) {
            if (value === null || value === undefined) return value ?? null;
            if (value instanceof admin.firestore.Timestamp) {
              return { __firestoreType: 'timestamp', seconds: value.seconds, nanoseconds: value.nanoseconds };
            }
            if (value instanceof admin.firestore.GeoPoint) {
              return { __firestoreType: 'geopoint', latitude: value.latitude, longitude: value.longitude };
            }
            if (value instanceof admin.firestore.DocumentReference) {
              return { __firestoreType: 'reference', path: value.path };
            }
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) {
              return { __firestoreType: 'bytes', base64: Buffer.from(value).toString('base64') };
            }
            if (Array.isArray(value)) return value.map(encode);
            if (typeof value === 'object') {
              const result = {};
              for (const [key, child] of Object.entries(value)) result[key] = encode(child);
              return result;
            }
            return value;
          }

          const documents = [];

          async function walkCollection(collectionRef) {
            const snapshot = await collectionRef.get();
            for (const doc of snapshot.docs) {
              documents.push({ path: doc.ref.path, data: encode(doc.data()) });
              const subcollections = await doc.ref.listCollections();
              for (const subcollection of subcollections) {
                await walkCollection(subcollection);
              }
            }
          }

          async function main() {
            const roots = await db.listCollections();
            for (const collection of roots) await walkCollection(collection);
            documents.sort((a, b) => a.path.localeCompare(b.path));

            const backup = {
              format: 'riflessa-firestore-json-v1',
              projectId: process.env.PROJECT_ID,
              databaseId: '(default)',
              createdAt: new Date().toISOString(),
              documentCount: documents.length,
              documents,
            };

            fs.writeFileSync(process.env.OUTPUT_FILE, JSON.stringify(backup, null, 2) + '\n');
            console.log(`Esportati ${documents.length} documenti Firestore.`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Crea backup con massimo 5 tentativi
        id: backup
        working-directory: backup-repo
        shell: bash
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SUCCESS=0
          FINAL_BACKUP=""

          for ATTEMPT in 1 2 3 4 5; do
            echo "Tentativo backup ${ATTEMPT}/5"

            git fetch origin main
            git reset --hard origin/main
            git clean -fd -- backup-registratore

            TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
            BACKUP_NAME="backup-${TIMESTAMP}"
            LOCAL_DIR="backup-registratore/${BACKUP_NAME}"
            OUTPUT_FILE="${PWD}/${LOCAL_DIR}/firestore.json"

            mkdir -p "${LOCAL_DIR}"

            if OUTPUT_FILE="${OUTPUT_FILE}" node "${RUNNER_TEMP}/firestore-backup-tool/export.cjs" \
              && node -e "const b=require(process.argv[1]); if(b.format!=='riflessa-firestore-json-v1'||!Array.isArray(b.documents)) process.exit(1); console.log('Backup JSON verificato:', b.documentCount, 'documenti');" "${OUTPUT_FILE}"; then

              cat > "${LOCAL_DIR}/BACKUP_INFO.txt" <<EOF
          Backup registratore Firestore
          Data UTC: ${TIMESTAMP}
          Progetto: ${PROJECT_ID}
          Formato: riflessa-firestore-json-v1
          Tentativo riuscito: ${ATTEMPT}/5
          EOF

              mapfile -t BACKUPS < <(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' | sort)
              COUNT="${#BACKUPS[@]}"
              echo "Backup presenti dopo la creazione: ${COUNT}"

              if (( COUNT >= 5 )); then
                echo "Soglia 5 raggiunta: elimino i precedenti e mantengo solo ${BACKUP_NAME}."
                for DIR in "${BACKUPS[@]}"; do
                  if [[ "${DIR}" != "${LOCAL_DIR}" ]]; then
                    rm -rf -- "${DIR}"
                  fi
                done
              fi

              git add backup-registratore
              git commit -m "Backup registratore ${TIMESTAMP} (tentativo ${ATTEMPT})"

              if git push origin HEAD:main; then
                SUCCESS=1
                FINAL_BACKUP="${BACKUP_NAME}"
                echo "Backup creato con successo nella repo privata: backup-registratore/${BACKUP_NAME}"
                break
              fi
            fi

            echo "::warning::Tentativo ${ATTEMPT}/5 non riuscito."
            git reset --hard origin/main >/dev/null 2>&1 || true
            git clean -fd -- backup-registratore >/dev/null 2>&1 || true

            if (( ATTEMPT < 5 )); then
              sleep $((ATTEMPT * 15))
            fi
          done

          if (( SUCCESS != 1 )); then
            echo "::error::Backup non creato dopo 5 tentativi."
            exit 1
          fi

          echo "backup_name=${FINAL_BACKUP}" >> "${GITHUB_OUTPUT}"

      - name: Riepilogo
        shell: bash
        run: |
          echo "Backup registratore completato nella repo privata."
          echo "Percorso: backup-registratore/${{ steps.backup.outputs.backup_name }}"
