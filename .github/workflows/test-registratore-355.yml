name: Test candidato registratore 3.5.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-registratore-355.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_REF: fix/registratore-3.5.5-final
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}

jobs:
  test-candidato:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verifica token sorgente
        shell: bash
        run: test -n "${SOURCE_PAT}" || { echo "PUBLIC_REPO_TOKEN mancante"; exit 1; }

      - name: Checkout candidato privato
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ env.SOURCE_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa dipendenze
        working-directory: source/${{ env.APP_DIR }}
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Esegui test
        working-directory: source/${{ env.APP_DIR }}
        run: npm test

      - name: Verifica progetto
        working-directory: source/${{ env.APP_DIR }}
        run: npm run check

      - name: Compila regole Firestore con emulatore
        working-directory: source/${{ env.APP_DIR }}
        shell: bash
        run: npx firebase emulators:exec --only firestore --project riflessa-15a20 "node -e \"console.log('Firestore rules OK')\""

      - name: Allinea package-lock della candidata
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Riflessa CI"
          git config user.email "actions@users.noreply.github.com"
          git add "${APP_DIR}/package-lock.json"
          if git diff --cached --quiet; then
            echo "package-lock già allineato"
            exit 0
          fi
          git commit -m "Allinea package-lock registratore 3.5.5"
          git push "https://x-access-token:${SOURCE_PAT}@github.com/${SOURCE_REPOSITORY}.git" "HEAD:${SOURCE_REF}"
