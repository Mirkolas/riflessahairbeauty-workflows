name: Avvia deploy e build registratore 3.5.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_dispatch-v353-final.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia deploy Firebase 3.5.3
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'firebase-deploy-registratore.yml',
              ref: 'main',
              inputs: { ref: 'b6f080c2ba64fc47a85a525d7823b1bc673ca6c2' }
            });
      - name: Avvia build EXE 3.5.3
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-exe-registratore.yml',
              ref: 'main'
            });
