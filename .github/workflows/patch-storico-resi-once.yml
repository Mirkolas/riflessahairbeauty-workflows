name: Patch bridge resi storico una tantum

on:
  push:
    paths:
      - '.github/workflows/patch-storico-resi-once.yml'

permissions:
  contents: write

env:
  APP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          path: workflow-src
          persist-credentials: true
      - name: Checkout app privata
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          token: ${{ env.SOURCE_PAT }}
          path: app-repo
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Espone il flusso fiscale esistente allo storico
        working-directory: app-repo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/app.js')
          s=p.read_text()
          if 'window.riflessaReceiptActions' in s:
              raise SystemExit('bridge gia presente')
          marker='// ---------- Returns ----------'
          if s.count(marker)!=1:
              raise SystemExit(f'marker Returns inatteso: {s.count(marker)}')
          bridge=(
              "function mergeHistoricalReturnsIntoState(relatedReturns=[]){\n"
              "  const known=new Set(state.returns.map(x=>x.id));\n"
              "  for(const item of relatedReturns){\n"
              "    if(!item?.id||known.has(item.id))continue;\n"
              "    state.returns.push(item);known.add(item.id);\n"
              "  }\n"
              "}\n"
              "window.riflessaReceiptActions=Object.freeze({\n"
              "  openSale(sale,relatedReturns=[]){mergeHistoricalReturnsIntoState(relatedReturns);return openSaleModal(sale);},\n"
              "  quickVoid(sale,relatedReturns=[]){mergeHistoricalReturnsIntoState(relatedReturns);return quickVoidSale(sale);}\n"
              "});\n\n"
          )
          s=s.replace(marker,bridge+marker,1)
          p.write_text(s)
          PY
          node --check riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/app.js
          node --check riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/sales-history-by-date.js
          git diff --check
      - name: Commit app
        working-directory: app-repo
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/app.js riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions/js/sales-history-by-date.js
          git commit -m 'Riusa il flusso fiscale per scontrini storici'
          git push origin HEAD:main
      - name: Rimuovi workflow temporaneo
        working-directory: workflow-src
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-storico-resi-once.yml
          git commit -m 'Rimuove patch temporanea storico resi'
          git push origin HEAD:main
