name: Patch checkpoint atomico una tantum

on:
  push:
    paths:
      - '.github/workflows/patch-checkpoint-atomic-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rende atomica la marcatura di fase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/backup-registratore-v3.cjs')
          s=p.read_text()
          old="async function markPhase(state, name, metadata) {\n  state.phases[name] = { ...metadata, completedAt: new Date().toISOString(), attempt: ATTEMPT };\n  saveState(state);\n  await persistCheckpoint(state, name);\n  console.log(`CHECKPOINT ${name}: completato.`);\n}\n"
          new="async function markPhase(state, name, metadata) {\n  state.phases[name] = { ...metadata, completedAt: new Date().toISOString(), attempt: ATTEMPT };\n  state.lastAttempt = ATTEMPT;\n  state.updatedAt = new Date().toISOString();\n  await persistCheckpoint(state, name);\n  writeJsonAtomic(STATE_FILE, state);\n  console.log(`CHECKPOINT ${name}: completato.`);\n}\n"
          if s.count(old)!=1:
              raise SystemExit(f'markPhase inatteso: {s.count(old)} match')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/backup-registratore-v3.cjs
          git diff --check
      - name: Commit patch e rimuovi workflow temporaneo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/backup-registratore-v3.cjs
          git rm .github/workflows/patch-checkpoint-atomic-once.yml
          git commit -m 'Rende atomica la persistenza dei checkpoint di fase'
          git push origin HEAD:main
