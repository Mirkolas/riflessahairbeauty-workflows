name: Configura auto update privato una tantum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-update-channel-once.yml'
      - '.github/scripts/private-update-patch.py'

permissions:
  contents: read

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
      SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
    steps:
      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_PAT" || { echo '::error::PUBLIC_REPO_TOKEN mancante'; exit 1; }
          test -n "$GOOGLE_CREDENTIALS_JSON" || { echo '::error::FIREBASE_SERVICE_ACCOUNT mancante'; exit 1; }
          test -n "$PROJECT_ID" || { echo '::error::FIREBASE_PROJECT_ID mancante'; exit 1; }

      - name: Checkout controllo workflow
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout sorgente privato
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Applica patch 3.5.11
        shell: bash
        run: |
          set -euo pipefail
          python3 control/.github/scripts/private-update-patch.py "source/${APP_DIR}"
          cd "source/${APP_DIR}"
          npm version 3.5.11 --no-git-tag-version
          npm install --prefix functions --package-lock-only --no-audit --no-fund

      - name: Test completi
        shell: bash
        working-directory: source/${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run check
          node scripts/release-preflight.cjs
          npm ci --prefix functions --no-audit --no-fund
          node -c functions/index.js

      - name: Commit sorgente privato
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'Mirko'
          git config user.email 'sonotacamirko@gmail.com'
          git add "$APP_DIR"
          git diff --cached --check
          git commit -m 'Aggiunge auto update privato autenticato 3.5.11'
          git push origin HEAD:main
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Imposta secret server-side e deploy funzione
        shell: bash
        working-directory: source/${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$RUNNER_TEMP/update-signer-service-account.json"
          ./node_modules/.bin/firebase functions:secrets:set UPDATE_SIGNER_SERVICE_ACCOUNT --data-file "$RUNNER_TEMP/update-signer-service-account.json" --project "$PROJECT_ID" --force
          ./node_modules/.bin/firebase deploy --project "$PROJECT_ID" --only functions:privateUpdates --non-interactive
          rm -f "$RUNNER_TEMP/update-signer-service-account.json"

      - name: Verifica endpoint non autenticato
        shell: bash
        run: |
          set -euo pipefail
          URL="https://europe-west1-${PROJECT_ID}.cloudfunctions.net/privateUpdates/latest.yml"
          CODE="$(curl -sS -o /tmp/private-update-check.txt -w '%{http_code}' "$URL")"
          test "$CODE" = '401' || { cat /tmp/private-update-check.txt; echo "::error::Endpoint privato inatteso: HTTP $CODE"; exit 1; }
          echo "Endpoint update privato attivo e protetto: HTTP $CODE"

