name: Finalizza diagnostica developer only 3.5.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-diagnostics-359-once.yml'

permissions:
  contents: read
  actions: write

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch 3.5.9 e test
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm ci --no-audit --no-fund
          npm version 3.5.9 --no-git-tag-version
          sed -i 's/3\.5\.8/3.5.9/g' scripts/check-project.js tests/auto-update.test.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('electron/main.js'); s=p.read_text()
          if 'let autoUpdateController = null;' not in s:
              s=s.replace('let fiscalIdempotency = null;\n','let fiscalIdempotency = null;\nlet autoUpdateController = null;\n',1)
          if 'autoUpdateController = setupRiflessaAutoUpdater({' not in s:
              s=s.replace('  setupRiflessaAutoUpdater({\n','  autoUpdateController = setupRiflessaAutoUpdater({\n',1)
          old="    latestLocalBackupMtime:latest || null, idempotency:idempotencyStore().summary()\n"
          new="    latestLocalBackupMtime:latest || null, idempotency:idempotencyStore().summary(),\n    updater:autoUpdateController?.getState?.() || null\n"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('firestore.rules'); s=p.read_text()
          if 'function isDeveloper()' not in s:
              s=s.replace("    function isStaff() { return signedIn() && (role() == 'admin' || role() == 'staff'); }\n", "    function isStaff() { return signedIn() && (role() == 'admin' || role() == 'staff'); }\n    function isDeveloper() { return signedIn() && exists(/databases/$(database)/documents/developerAccess/$(request.auth.uid)); }\n",1)
          old="""    match /deviceStatus/{deviceId} {
      allow read: if isAdmin();
      allow create, update: if isStaff()
        && request.resource.data.schemaVersion == 1
        && request.resource.data.deviceId == deviceId
        && request.resource.data.operatorUid == request.auth.uid;
      allow delete: if isAdmin();
    }
"""
          new="""    match /developerAccess/{uid} {
      allow read: if signedIn() && request.auth.uid == uid;
      allow write: if false;
    }

    match /deviceStatus/{deviceId} {
      allow read: if isDeveloper();
      allow create, update: if isStaff()
        && request.resource.data.schemaVersion == 2
        && request.resource.data.deviceId == deviceId
        && request.resource.data.operatorUid == request.auth.uid
        && request.resource.data.keys().hasOnly([
          'schemaVersion','deviceId','deviceLabel','operatorUid','appVersion','platform','channel',
          'rtReachable','fiscalQueueDepth','fiscalActiveLabel','idempotencyInflight',
          'idempotencyUncertain','idempotencyUnresolved','localRecoveryCount','activeFiscalIntent',
          'latestLocalBackupMtime','network','updater','lastRtError','lastAppError','lastSeenAt','lastSeenAtClient'
        ]);
      allow delete: if isDeveloper();
    }
"""
          if old not in s and 'match /developerAccess/' not in s:
              raise SystemExit('deviceStatus rules anchor not found')
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check electron/main.js
          node --check electron/auto-updater.js
          npm test
          npm run check
          grep -q "developerAccess" firestore.rules
          grep -q "schemaVersion == 2" firestore.rules
          git diff --check

      - name: Commit sorgente 3.5.9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$APP_DIR"
          git commit -m 'Aggiunge diagnostica developer only registratore 3.5.9'
          git push origin HEAD:main

      - name: Assegna accesso sviluppatore unico
        shell: bash
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          npm install firebase-admin@13 --no-save --no-audit --no-fund
          node <<'NODE'
          const admin=require('firebase-admin');
          const sa=JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);
          admin.initializeApp({credential:admin.credential.cert(sa),projectId:process.env.PROJECT_ID});
          (async()=>{
            const db=admin.firestore();
            const snap=await db.collection('users').where('role','==','admin').get();
            if(snap.size!==1) throw new Error(`Attesi esattamente 1 admin, trovati ${snap.size}. Nessun accesso developer assegnato.`);
            const uid=snap.docs[0].id;
            await db.collection('developerAccess').doc(uid).set({enabled:true,createdAt:admin.firestore.FieldValue.serverTimestamp(),source:'diagnostics-3.5.9'});
            console.log(`Accesso developer assegnato a un solo UID (${uid.slice(0,6)}...)`);
          })();
          NODE

      - name: Deploy rules
        shell: bash
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),admin=require('firebase-admin'),sa=JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);
          if(!admin.apps.length) admin.initializeApp({credential:admin.credential.cert(sa),projectId:process.env.PROJECT_ID});
          const src=fs.readFileSync(process.env.APP_DIR+'/firestore.rules','utf8');
          admin.securityRules().releaseFirestoreRulesetFromSource(src).then(()=>console.log('Rules developer-only pubblicate'));
          NODE

      - name: Deploy monitor hosting
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools@13
          cd "$APP_DIR"
          firebase deploy --only hosting:registratore --project "$PROJECT_ID" --non-interactive

      - name: Avvia release permanente 3.5.9
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-auto-update-registratore.yml --repo "$GITHUB_REPOSITORY"
