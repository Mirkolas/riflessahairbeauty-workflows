name: Release 3.5.21 splash inquadrato (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-3521-splash-frame-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-3521-splash-frame-once
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: Mirkolas/riflessahairbeauty
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions

jobs:
  prepara-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
    steps:
      - name: Verifica token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_PAT" || { echo '::error::Secret PUBLIC_REPO_TOKEN mancante'; exit 1; }

      - name: Checkout sorgente privata
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: true

      - name: Corregge inquadratura splash e prepara 3.5.21
        shell: bash
        run: |
          set -euo pipefail
          APP="source/${APP_DIR}"
          CURRENT="$(node -p "require('./${APP}/package.json').version")"
          test "$CURRENT" = "3.5.20" || { echo "::error::Versione privata inattesa: ${CURRENT}"; exit 1; }

          APP="$APP" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const app = process.env.APP;

          const splashPath = path.join(app, 'electron', 'splash.html');
          let splash = fs.readFileSync(splashPath, 'utf8');
          const blockMatch = splash.match(/\.logo-wrap img\{([^}]*)\}/i);
          if (!blockMatch) throw new Error('Blocco CSS .logo-wrap img non trovato');
          const current = blockMatch[1];
          for (const expected of ['width:314px;', 'height:314px;', 'max-width:none;', 'object-fit:contain;']) {
            if (!current.includes(expected)) throw new Error(`CSS splash inatteso: manca ${expected}`);
          }
          const replacement = `.logo-wrap img{
                display:block;
                width:274px;
                height:274px;
                max-width:100%;
                object-fit:contain;
                object-position:center center;
                image-rendering:auto;
                filter:none;
                transform:none;
              }`;
          splash = splash.replace(blockMatch[0], replacement);
          fs.writeFileSync(splashPath, splash);

          const testPath = path.join(app, 'tests', 'startup-splash.test.js');
          let test = fs.readFileSync(testPath, 'utf8');
          const assertionRe = /^\s*assert\.match\(splash, \/\\\.logo-wrap img\\\{\[\\s\\S\]\*width:314px;\[\\s\\S\]\*height:314px;\[\\s\\S\]\*object-fit:contain;\[\\s\\S\]\*filter:none;\[\\s\\S\]\*transform:none\/\);\s*$/m;
          if (!assertionRe.test(test)) throw new Error('Assertion splash 314px attesa non trovata');
          const newAssertion = `            const logoCss = splash.match(/\\.logo-wrap img\\{([^}]*)\\}/i)?.[1] || '';
            assert.match(logoCss, /width:274px;/);
            assert.match(logoCss, /height:274px;/);
            assert.match(logoCss, /max-width:100%;/);
            assert.match(logoCss, /object-fit:contain;/);
            assert.match(logoCss, /object-position:center center;/);
            assert.match(logoCss, /filter:none;/);
            assert.match(logoCss, /transform:none;/);
            assert.doesNotMatch(logoCss, /314px|object-fit:cover|max-width:none/);`;
          test = test.replace(assertionRe, newAssertion);
          fs.writeFileSync(testPath, test);
          NODE

          cd "$APP"
          npm version 3.5.21 --no-git-tag-version

      - name: Test e preflight release
        shell: bash
        run: |
          set -euo pipefail
          cd "source/${APP_DIR}"
          npm ci --no-audit --no-fund
          npm run release:check
          test "$(node -p "require('./package.json').version")" = "3.5.21"
          test "$(node -p "require('./package-lock.json').version")" = "3.5.21"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "3.5.21"
          grep -q 'width:274px;' electron/splash.html
          grep -q 'height:274px;' electron/splash.html
          grep -q 'max-width:100%;' electron/splash.html
          grep -q 'object-position:center center;' electron/splash.html
          git diff --check

      - name: Push atomico 3.5.21 sulla repo privata
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${APP_DIR}/electron/splash.html" \
                  "${APP_DIR}/tests/startup-splash.test.js" \
                  "${APP_DIR}/package.json" \
                  "${APP_DIR}/package-lock.json"
          git diff --cached --check
          git commit -m "Release 3.5.21: corregge inquadratura splash"
          git push origin HEAD:main

      - name: Avvia build pubblica immediata
        if: ${{ env.WORKFLOW_PAT != '' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ env.WORKFLOW_PAT }}
        run: |
          gh workflow run build-exe-registratore.yml \
            --repo Mirkolas/riflessahairbeauty-workflows \
            --ref main
