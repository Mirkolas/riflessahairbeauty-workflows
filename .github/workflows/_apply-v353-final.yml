name: Applica e verifica registratore 3.5.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_apply-v353-final.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions

jobs:
  apply-test-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Verifica token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_PAT}" || { echo "PUBLIC_REPO_TOKEN mancante"; exit 1; }

      - name: Checkout repo privata
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Applica patch automazione 3.5.3
        shell: bash
        run: python workflows/scripts/apply-v353-automation.py source

      - name: Imposta versione 3.5.3
        working-directory: source/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"
          if [[ "${CURRENT}" != "3.5.3" ]]; then
            npm version 3.5.3 --no-git-tag-version
          fi

      - name: Installa dipendenze
        working-directory: source/${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Test patch prima della pubblicazione
        working-directory: source/${{ env.APP_DIR }}
        run: npm test

      - name: Check progetto prima della pubblicazione
        working-directory: source/${{ env.APP_DIR }}
        run: npm run check

      - name: Verifica diff
        working-directory: source
        shell: bash
        run: git diff --check

      - name: Pubblica file su main via GitHub Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          set -euo pipefail

          make_put_body() {
            local local_file="$1"
            local sha="$2"
            local rel="$3"
            python - "$local_file" "$sha" "$rel" <<'PY'
          import base64, json, sys
          local_file, sha, rel = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(local_file, 'rb') as fh:
              encoded = base64.b64encode(fh.read()).decode('ascii')
          body = {
              'message': f'Automatizza registratore 3.5.3: {rel}',
              'content': encoded,
              'branch': 'main'
          }
          if sha:
              body['sha'] = sha
          with open('/tmp/github-body.json', 'w', encoding='utf-8') as fh:
              json.dump(body, fh)
          PY
          }

          upsert_file() {
            local rel="$1"
            local local_file="source/$rel"
            local sha
            sha="$(gh api "repos/${SOURCE_REPOSITORY}/contents/${rel}?ref=main" --jq '.sha' 2>/dev/null || true)"
            make_put_body "$local_file" "$sha" "$rel"
            gh api --method PUT "repos/${SOURCE_REPOSITORY}/contents/${rel}" --input /tmp/github-body.json >/dev/null
            echo "Pubblicato: $rel"
          }

          delete_file_if_exists() {
            local rel="$1"
            local sha
            sha="$(gh api "repos/${SOURCE_REPOSITORY}/contents/${rel}?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              python - "$sha" <<'PY'
          import json, sys
          with open('/tmp/github-delete.json', 'w', encoding='utf-8') as fh:
              json.dump({'message':'Aggiorna guida registratore 3.5.3','sha':sys.argv[1],'branch':'main'}, fh)
          PY
              gh api --method DELETE "repos/${SOURCE_REPOSITORY}/contents/${rel}" --input /tmp/github-delete.json >/dev/null
              echo "Eliminato: $rel"
            fi
          }

          # File applicativi prima della versione, così il builder non vede una 3.5.3 parziale.
          upsert_file "${APP_DIR}/js/app.js"
          upsert_file "${APP_DIR}/index.html"
          upsert_file "${APP_DIR}/electron/main.js"
          upsert_file "${APP_DIR}/tests/automatic-fiscal-closure.test.js"

          # Guida aggiornata nella root privata.
          upsert_file "Guida_Riflessa_App_Registratore_3.5.3.txt"
          delete_file_if_exists "Guida_Riflessa_App_Registratore_3.5.2.txt"

          # Lockfile e package.json per ultimo. package.json è l'interruttore della nuova release.
          upsert_file "${APP_DIR}/package-lock.json"
          upsert_file "${APP_DIR}/package.json"

      - name: Checkout main pubblicato da zero
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: verify
          persist-credentials: false
          fetch-depth: 1

      - name: Verifica versione pubblicata
        working-directory: verify/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "3.5.3"
          grep -q 'scheduleFiscalTransmissionChecks' js/app.js
          ! grep -q 'confirmFiscalCloseBtn' index.html
          grep -q '768 \* 1024' electron/main.js

      - name: Installa dipendenze sul main pubblicato
        working-directory: verify/${{ env.APP_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Test finali sul main pubblicato
        working-directory: verify/${{ env.APP_DIR }}
        run: npm test

      - name: Check finale sul main pubblicato
        working-directory: verify/${{ env.APP_DIR }}
        run: npm run check
