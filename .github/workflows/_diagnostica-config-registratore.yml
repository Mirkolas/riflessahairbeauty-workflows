name: Diagnostica PAT registratore

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_diagnostica-config-registratore.yml"

permissions:
  contents: read

jobs:
  discover:
    name: Verifica PAT come Variable senza esporre valori
    runs-on: ubuntu-latest
    steps:
      - name: Variable PAT
        if: ${{ vars.PAT != '' }}
        run: echo "FOUND_VAR=PAT"
      - name: Variable PAT_GITHUB
        if: ${{ vars.PAT_GITHUB != '' }}
        run: echo "FOUND_VAR=PAT_GITHUB"
      - name: Variable GH_PAT
        if: ${{ vars.GH_PAT != '' }}
        run: echo "FOUND_VAR=GH_PAT"
      - name: Variable PAT_TOKEN
        if: ${{ vars.PAT_TOKEN != '' }}
        run: echo "FOUND_VAR=PAT_TOKEN"
      - name: Variable ACCESS_TOKEN
        if: ${{ vars.ACCESS_TOKEN != '' }}
        run: echo "FOUND_VAR=ACCESS_TOKEN"
      - name: Variable REPO_PAT
        if: ${{ vars.REPO_PAT != '' }}
        run: echo "FOUND_VAR=REPO_PAT"
      - name: Variable WORKFLOW_PAT
        if: ${{ vars.WORKFLOW_PAT != '' }}
        run: echo "FOUND_VAR=WORKFLOW_PAT"
      - name: Variable FIREBASE_PAT
        if: ${{ vars.FIREBASE_PAT != '' }}
        run: echo "FOUND_VAR=FIREBASE_PAT"
      - name: Variable GIT_PAT
        if: ${{ vars.GIT_PAT != '' }}
        run: echo "FOUND_VAR=GIT_PAT"
      - name: Variable TOKEN
        if: ${{ vars.TOKEN != '' }}
        run: echo "FOUND_VAR=TOKEN"
