name: Diagnostica PAT registratore

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_diagnostica-config-registratore.yml"

permissions:
  contents: read

jobs:
  discover:
    name: Verifica nome PAT senza esporre valori
    runs-on: ubuntu-latest
    steps:
      - name: Cerca PAT configurato
        shell: bash
        env:
          P1: ${{ secrets.GH_TOKEN }}
          P2: ${{ secrets.PRIVATE_REPO_PAT }}
          P3: ${{ secrets.REPO_ACCESS_TOKEN }}
          P4: ${{ secrets.ACCESS_TOKEN }}
          P5: ${{ secrets.PRIVATE_REPO_TOKEN }}
          P6: ${{ secrets.PAT_PRIVATE_REPO }}
        run: |
          [[ -n "$P1" ]] && echo "FOUND_SECRET=GH_TOKEN" || true
          [[ -n "$P2" ]] && echo "FOUND_SECRET=PRIVATE_REPO_PAT" || true
          [[ -n "$P3" ]] && echo "FOUND_SECRET=REPO_ACCESS_TOKEN" || true
          [[ -n "$P4" ]] && echo "FOUND_SECRET=ACCESS_TOKEN" || true
          [[ -n "$P5" ]] && echo "FOUND_SECRET=PRIVATE_REPO_TOKEN" || true
          [[ -n "$P6" ]] && echo "FOUND_SECRET=PAT_PRIVATE_REPO" || true
