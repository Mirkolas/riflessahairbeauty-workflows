name: Diagnostica PAT registratore

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_diagnostica-config-registratore.yml"

permissions:
  contents: read

jobs:
  discover:
    name: Verifica nome PAT senza esporre valori
    runs-on: ubuntu-latest
    steps:
      - name: Cerca PAT configurato
        shell: bash
        env:
          P1: ${{ secrets.WORKFLOW_PAT }}
          P2: ${{ secrets.WORKFLOWS_PAT }}
          P3: ${{ secrets.DEPLOY_PAT }}
          P4: ${{ secrets.PAT_DEPLOY }}
          P5: ${{ secrets.FIREBASE_DEPLOY_PAT }}
          P6: ${{ secrets.REPOSITORY_PAT }}
        run: |
          [[ -n "$P1" ]] && echo "FOUND_SECRET=WORKFLOW_PAT" || true
          [[ -n "$P2" ]] && echo "FOUND_SECRET=WORKFLOWS_PAT" || true
          [[ -n "$P3" ]] && echo "FOUND_SECRET=DEPLOY_PAT" || true
          [[ -n "$P4" ]] && echo "FOUND_SECRET=PAT_DEPLOY" || true
          [[ -n "$P5" ]] && echo "FOUND_SECRET=FIREBASE_DEPLOY_PAT" || true
          [[ -n "$P6" ]] && echo "FOUND_SECRET=REPOSITORY_PAT" || true
