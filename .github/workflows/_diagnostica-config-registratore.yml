name: Diagnostica PAT registratore

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_diagnostica-config-registratore.yml"

permissions:
  contents: read

jobs:
  discover:
    name: Verifica nome PAT senza esporre valori
    runs-on: ubuntu-latest
    steps:
      - name: Cerca PAT configurato
        shell: bash
        env:
          P1: ${{ secrets.PAT_REPO }}
          P2: ${{ secrets.PAT_WORKFLOWS }}
          P3: ${{ secrets.TOKEN_PAT }}
          P4: ${{ secrets.GITHUB_ACCESS_TOKEN }}
          P5: ${{ secrets.REPO_TOKEN }}
          P6: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          [[ -n "$P1" ]] && echo "FOUND_SECRET=PAT_REPO" || true
          [[ -n "$P2" ]] && echo "FOUND_SECRET=PAT_WORKFLOWS" || true
          [[ -n "$P3" ]] && echo "FOUND_SECRET=TOKEN_PAT" || true
          [[ -n "$P4" ]] && echo "FOUND_SECRET=GITHUB_ACCESS_TOKEN" || true
          [[ -n "$P5" ]] && echo "FOUND_SECRET=REPO_TOKEN" || true
          [[ -n "$P6" ]] && echo "FOUND_SECRET=WORKFLOW_TOKEN" || true
