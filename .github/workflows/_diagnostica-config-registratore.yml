name: Diagnostica PAT registratore

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_diagnostica-config-registratore.yml"

permissions:
  contents: read

jobs:
  discover:
    name: Verifica nome PAT senza esporre valori
    runs-on: ubuntu-latest
    steps:
      - name: Cerca PAT configurato
        shell: bash
        env:
          P1: ${{ secrets.PAT_GITHUB }}
          P2: ${{ secrets.TOKEN_GITHUB }}
          P3: ${{ secrets.PAT_RIFLESSA }}
          P4: ${{ secrets.RIFLESSA_TOKEN }}
        run: |
          [[ -n "$P1" ]] && echo "FOUND_SECRET=PAT_GITHUB" || true
          [[ -n "$P2" ]] && echo "FOUND_SECRET=TOKEN_GITHUB" || true
          [[ -n "$P3" ]] && echo "FOUND_SECRET=PAT_RIFLESSA" || true
          [[ -n "$P4" ]] && echo "FOUND_SECRET=RIFLESSA_TOKEN" || true
