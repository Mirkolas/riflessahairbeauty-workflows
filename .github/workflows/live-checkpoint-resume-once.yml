name: Test reale checkpoint resume una tantum

on:
  push:
    paths:
      - '.github/workflows/live-checkpoint-resume-once.yml'

permissions:
  contents: write

concurrency:
  group: firebase-backup-registratore
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  BACKUP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}

jobs:
  checkpoint-runner-a:
    name: Runner A - Firestore e arresto intenzionale
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PROJECT_ID}" ]] || { echo "::error::Manca FIREBASE_PROJECT_ID"; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo "::error::Manca FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo "::error::Manca PUBLIC_REPO_TOKEN"; exit 1; }
          [[ -n "${AUTH_HASH_CONFIG}" ]] || { echo "::error::Manca FIREBASE_AUTH_HASH_CONFIG"; exit 1; }

      - uses: actions/checkout@v4
        with:
          path: workflow-src
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installa Firebase Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/registratore-backup-tool"
          npm install --prefix "${RUNNER_TEMP}/registratore-backup-tool" firebase-admin@13 --no-audit --no-fund >/dev/null

      - name: Crea checkpoint Firestore e simula morte runner
        working-directory: backup-repo
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/registratore-backup-tool/node_modules
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test ! -f .backup-checkpoints/registratore/resume.json || { echo '::error::Esiste gia un checkpoint reale: test annullato per non interferire.'; exit 1; }

          APP_DIR='riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions'
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          BACKUP_NAME="backup-$(date -u +'%Y%m%d-%H%M%S')"
          PREVIOUS_BACKUP_NAME="$(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' -printf '%f\n' 2>/dev/null | sort | tail -n 1)"
          PREVIOUS_BACKUP_DIR=""
          [[ -z "${PREVIOUS_BACKUP_NAME}" ]] || PREVIOUS_BACKUP_DIR="${PWD}/backup-registratore/${PREVIOUS_BACKUP_NAME}"
          CHECKPOINT_DIR="${RUNNER_TEMP}/checkpoint-a"
          PERSISTENT_CHECKPOINT_DIR="${PWD}/.backup-checkpoints/registratore"
          FINAL_DIR="${PWD}/backup-registratore/${BACKUP_NAME}"
          SOURCE_TREE="${RUNNER_TEMP}/source-a"
          mkdir -p "${CHECKPOINT_DIR}/source-app" "${SOURCE_TREE}"
          git archive "${SOURCE_COMMIT}" -- "${APP_DIR}" | tar -x -C "${SOURCE_TREE}"
          rsync -a --delete --exclude node_modules --exclude dist "${SOURCE_TREE}/${APP_DIR}/" "${CHECKPOINT_DIR}/source-app/"

          set +e
          CHECKPOINT_DIR="${CHECKPOINT_DIR}" FINAL_DIR="${FINAL_DIR}" PREVIOUS_BACKUP_DIR="${PREVIOUS_BACKUP_DIR}" PREVIOUS_BACKUP_NAME="${PREVIOUS_BACKUP_NAME}" SOURCE_APP_DIR="${CHECKPOINT_DIR}/source-app" SOURCE_COMMIT="${SOURCE_COMMIT}" BACKUP_NAME="${BACKUP_NAME}" ATTEMPT=1 BACKUP_REPO_DIR="${PWD}" PERSISTENT_CHECKPOINT_DIR="${PERSISTENT_CHECKPOINT_DIR}" ALLOW_TEST_FAILPOINTS=1 TEST_STOP_AFTER_PHASE=firestore node "${GITHUB_WORKSPACE}/workflow-src/scripts/backup-registratore-v3.cjs" 2>&1 | tee "${RUNNER_TEMP}/runner-a.log"
          RC=${PIPESTATUS[0]}
          set -e
          [[ ${RC} -ne 0 ]] || { echo '::error::Il failpoint non ha fermato il processo.'; exit 1; }
          grep -q 'TEST_FAILPOINT_AFTER_FIRESTORE' "${RUNNER_TEMP}/runner-a.log" || { echo '::error::Arresto non causato dal failpoint atteso.'; exit 1; }

          git fetch origin main
          git reset --hard origin/main
          test -f .backup-checkpoints/registratore/resume.json
          node - <<'NODE'
          const m=require('./.backup-checkpoints/registratore/resume.json');
          if(m.format!=='riflessa-persistent-checkpoint-v1') throw new Error('resume format non valido');
          if(!Array.isArray(m.completedPhases)||m.completedPhases.length!==1||m.completedPhases[0]!=='firestore') throw new Error(`fasi inattese: ${JSON.stringify(m.completedPhases)}`);
          console.log(`Runner A OK: ${m.backupName}, Firestore persistito, boundary ${m.boundary}`);
          NODE

  resume-runner-b:
    name: Runner B - resume da repository e backup finale
    needs: checkpoint-runner-a
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: workflow-src
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installa Firebase Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/registratore-backup-tool"
          npm install --prefix "${RUNNER_TEMP}/registratore-backup-tool" firebase-admin@13 --no-audit --no-fund >/dev/null

      - name: Riprende il checkpoint su runner nuovo e verifica backup
        working-directory: backup-repo
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/registratore-backup-tool/node_modules
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          RESUME='.backup-checkpoints/registratore/resume.json'
          test -f "${RESUME}"
          BACKUP_NAME="$(node -p "require('./${RESUME}').backupName")"
          SOURCE_COMMIT="$(node -p "require('./${RESUME}').sourceCommit")"
          PREVIOUS_BACKUP_NAME="$(node -p "require('./${RESUME}').previousBackupName || ''")"
          PREVIOUS_BACKUP_DIR=""
          [[ -z "${PREVIOUS_BACKUP_NAME}" ]] || PREVIOUS_BACKUP_DIR="${PWD}/backup-registratore/${PREVIOUS_BACKUP_NAME}"
          APP_DIR='riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions'
          CHECKPOINT_DIR="${RUNNER_TEMP}/checkpoint-b"
          PERSISTENT_CHECKPOINT_DIR="${PWD}/.backup-checkpoints/registratore"
          FINAL_DIR="${PWD}/backup-registratore/${BACKUP_NAME}"
          SOURCE_TREE="${RUNNER_TEMP}/source-b"
          mkdir -p "${CHECKPOINT_DIR}/source-app" "${SOURCE_TREE}"
          git archive "${SOURCE_COMMIT}" -- "${APP_DIR}" | tar -x -C "${SOURCE_TREE}"
          rsync -a --delete --exclude node_modules --exclude dist "${SOURCE_TREE}/${APP_DIR}/" "${CHECKPOINT_DIR}/source-app/"

          CHECKPOINT_DIR="${CHECKPOINT_DIR}" FINAL_DIR="${FINAL_DIR}" PREVIOUS_BACKUP_DIR="${PREVIOUS_BACKUP_DIR}" PREVIOUS_BACKUP_NAME="${PREVIOUS_BACKUP_NAME}" SOURCE_APP_DIR="${CHECKPOINT_DIR}/source-app" SOURCE_COMMIT="${SOURCE_COMMIT}" BACKUP_NAME="${BACKUP_NAME}" ATTEMPT=2 BACKUP_REPO_DIR="${PWD}" PERSISTENT_CHECKPOINT_DIR="${PERSISTENT_CHECKPOINT_DIR}" node "${GITHUB_WORKSPACE}/workflow-src/scripts/backup-registratore-v3.cjs" 2>&1 | tee "${RUNNER_TEMP}/runner-b.log"
          grep -q 'RESUME CROSS-RUN' "${RUNNER_TEMP}/runner-b.log"
          grep -q 'RESUME: Firestore gia completato e verificato' "${RUNNER_TEMP}/runner-b.log"
          BACKUP_PATH="${FINAL_DIR}" node "${GITHUB_WORKSPACE}/workflow-src/scripts/verifica-backup-registratore.cjs"

          rm -rf "${PERSISTENT_CHECKPOINT_DIR}"
          git add -A -- backup-registratore .backup-checkpoints
          git commit -m "Test reale resume checkpoint ${BACKUP_NAME}: backup verificato su runner nuovo"
          git push origin HEAD:main
          test ! -e "${PERSISTENT_CHECKPOINT_DIR}"
          echo "Test cross-run completato: ${BACKUP_NAME}"

  cleanup:
    name: Rimuove workflow test una tantum
    needs: resume-runner-b
    if: needs.resume-runner-b.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rimuove trigger temporaneo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/live-checkpoint-resume-once.yml
          git commit -m 'Rimuove test temporaneo checkpoint resume'
          git push origin HEAD:main
