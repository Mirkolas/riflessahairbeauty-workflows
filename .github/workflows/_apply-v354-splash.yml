name: Applica splash registratore 3.5.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_apply-v354-splash.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Checkout repo privata
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: true
          fetch-depth: 2

      - name: Applica splash professionale
        run: python workflows/scripts/apply-v354-splash.py source

      - name: Imposta versione 3.5.4
        working-directory: source/${{ env.APP_DIR }}
        run: npm version 3.5.4 --no-git-tag-version

      - name: Installa dipendenze
        working-directory: source/${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Test
        working-directory: source/${{ env.APP_DIR }}
        run: npm test

      - name: Check progetto
        working-directory: source/${{ env.APP_DIR }}
        run: npm run check

      - name: Verifica diff
        working-directory: source
        run: git diff --check

      - name: Pubblica su main privata
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mirko"
          git config user.email "sonotacamirko@gmail.com"
          git add \
            "${APP_DIR}/electron/main.js" \
            "${APP_DIR}/electron/splash.html" \
            "${APP_DIR}/tests/startup-splash.test.js" \
            "${APP_DIR}/package.json" \
            "${APP_DIR}/package-lock.json"
          git commit -m "Aggiungi splash professionale registratore 3.5.4"
          git push origin HEAD:main
