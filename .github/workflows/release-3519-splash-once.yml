name: Hotfix verifica release 3.5.19 - one shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-3519-splash-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow pubblici
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Corregge gestione 404 release
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('.github/workflows/build-exe-registratore.yml')
          s = p.read_text(encoding='utf-8')
          old = '''          RELEASE_JSON="$(gh api "repos/${SOURCE_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null || true)"
          RELEASE_COMPLETE=false
'''
          new = '''          RELEASE_JSON=""
          if RELEASE_RESPONSE="$(gh api "repos/${SOURCE_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null)"; then
            RELEASE_JSON="$RELEASE_RESPONSE"
          fi
          RELEASE_COMPLETE=false
'''
          if old not in s:
              raise SystemExit('Blocco release atteso non trovato: nessuna modifica applicata')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Verifica modifica
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'if RELEASE_RESPONSE="$(gh api "repos/${SOURCE_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null)"; then' .github/workflows/build-exe-registratore.yml
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/build-exe-registratore.yml', aliases: true); puts 'YAML OK'"
          git diff --check

      - name: Commit e push hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-exe-registratore.yml
          git commit -m 'Corregge falso positivo su release GitHub assente'
          git push origin HEAD:main

      - name: Avvia build 3.5.19
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-exe-registratore.yml \
            --repo Mirkolas/riflessahairbeauty-workflows \
            --ref main
