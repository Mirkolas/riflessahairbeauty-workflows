name: Verifica Firebase test una tantum

on:
  push:
    paths:
      - '.github/workflows/probe-firebase-test-once.yml'

permissions:
  contents: read

env:
  PROD_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  TEST_PROJECT_ID: ${{ vars.FIREBASE_TEST_PROJECT_ID }}
  TEST_RESTORE_ENABLED: ${{ vars.FIREBASE_TEST_RESTORE_ENABLED }}
  TEST_GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_TEST_SERVICE_ACCOUNT }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla configurazione progetto test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TEST_RESTORE_ENABLED}" != "true" ]]; then
            echo 'TEST_CONFIG_STATUS=disabled'
            exit 0
          fi
          [[ -n "${PROD_PROJECT_ID}" ]] || { echo 'TEST_CONFIG_STATUS=missing_prod_project'; exit 1; }
          [[ -n "${TEST_PROJECT_ID}" ]] || { echo 'TEST_CONFIG_STATUS=missing_test_project'; exit 1; }
          [[ "${TEST_PROJECT_ID}" != "${PROD_PROJECT_ID}" ]] || { echo 'TEST_CONFIG_STATUS=unsafe_same_project'; exit 1; }
          [[ -n "${TEST_GOOGLE_CREDENTIALS_JSON}" ]] || { echo 'TEST_CONFIG_STATUS=missing_test_service_account'; exit 1; }
          SA_PROJECT="$(node -e 'const c=JSON.parse(process.env.TEST_GOOGLE_CREDENTIALS_JSON);process.stdout.write(c.project_id||"")')"
          [[ "${SA_PROJECT}" == "${TEST_PROJECT_ID}" ]] || { echo "TEST_CONFIG_STATUS=service_account_mismatch:${SA_PROJECT}"; exit 1; }
          echo "TEST_CONFIG_STATUS=ready:${TEST_PROJECT_ID}"
