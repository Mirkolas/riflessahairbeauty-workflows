name: Test backup restore emulator - registratore

on:
  schedule:
    - cron: "15 4 1 * *"
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/firebase-test-restore-emulator-registratore.yml'

permissions:
  contents: read

concurrency:
  group: firebase-test-restore-emulator-registratore
  cancel-in-progress: false

env:
  PROD_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  EMULATOR_PROJECT_ID: demo-riflessa-restore
  BACKUP_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}

jobs:
  restore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Verifica configurazione e isolamento
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PROD_PROJECT_ID}" ]] || { echo '::error::Manca FIREBASE_PROJECT_ID'; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo '::error::Manca PUBLIC_REPO_TOKEN'; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo '::error::Manca FIREBASE_SERVICE_ACCOUNT'; exit 1; }
          [[ -n "${AUTH_HASH_CONFIG}" ]] || { echo '::error::Manca FIREBASE_AUTH_HASH_CONFIG'; exit 1; }
          [[ "${EMULATOR_PROJECT_ID}" == demo-* ]] || { echo '::error::Il target emulator deve iniziare con demo-'; exit 1; }
          [[ "${EMULATOR_PROJECT_ID}" != "${PROD_PROJECT_ID}" ]] || { echo '::error::Target emulator uguale alla produzione'; exit 1; }
          echo "Target isolato: ${EMULATOR_PROJECT_ID}"

      - name: Checkout workflow e script
        uses: actions/checkout@v4
        with:
          path: workflow-src
          persist-credentials: false

      - name: Checkout backup privati
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: backup-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configura Java per Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installa Firebase Admin SDK e CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/restore-tool" "${RUNNER_TEMP}/firebase-cli"
          npm install --prefix "${RUNNER_TEMP}/restore-tool" firebase-admin@13 --no-audit --no-fund >/dev/null
          npm install --prefix "${RUNNER_TEMP}/firebase-cli" firebase-tools --no-audit --no-fund >/dev/null

      - name: Seleziona ultimo backup v3 verificabile
        id: backup
        working-directory: backup-repo
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_PATH=''
          while IFS= read -r candidate; do
            [[ -f "${candidate}/manifest.json" ]] || continue
            FORMAT="$(node -p "require('./${candidate}/manifest.json').format || ''")"
            if [[ "${FORMAT}" == 'riflessa-registratore-encrypted-v3' ]]; then
              BACKUP_PATH="${candidate}"
              break
            fi
          done < <(find backup-registratore -mindepth 1 -maxdepth 1 -type d -name 'backup-*' | sort -r)
          [[ -n "${BACKUP_PATH}" ]] || { echo '::error::Nessun backup v3 disponibile'; exit 1; }
          echo "path=${BACKUP_PATH}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${BACKUP_PATH}")" >> "${GITHUB_OUTPUT}"

      - name: Verifica archivio cifrato sorgente
        working-directory: backup-repo
        env:
          PROJECT_ID: ${{ env.PROD_PROJECT_ID }}
          BACKUP_PATH: ${{ steps.backup.outputs.path }}
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE}/workflow-src/scripts/verifica-backup-registratore.cjs"

      - name: Prepara Emulator Suite e test E2E
        id: prepare
        shell: bash
        env:
          BACKUP_PATH_REL: ${{ steps.backup.outputs.path }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/riflessa-emulator-e2e"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}/site/public" "${ROOT}/restored"
          cat > "${ROOT}/firebase.json" <<'JSON'
          {
            "firestore": { "rules": "firestore.rules" },
            "hosting": { "public": "site/public", "ignore": [] },
            "emulators": {
              "firestore": { "port": 8085 },
              "auth": { "port": 9098 },
              "hosting": { "port": 5007 },
              "ui": { "enabled": false }
            }
          }
          JSON
          cat > "${ROOT}/firestore.rules" <<'RULES'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /{document=**} { allow read, write: if true; }
            }
          }
          RULES
          cat > "${ROOT}/run-e2e.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${FIRESTORE_EMULATOR_HOST:?Firestore Emulator non impostato}"
          : "${FIREBASE_AUTH_EMULATOR_HOST:?Auth Emulator non impostato}"
          echo "Firestore emulator: ${FIRESTORE_EMULATOR_HOST}"
          echo "Auth emulator: ${FIREBASE_AUTH_EMULATOR_HOST}"

          PROBE_UID="restore-probe-${GITHUB_RUN_ID}"
          export PROBE_UID
          node <<'NODE'
          const admin=require('firebase-admin');
          const c=JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);
          admin.initializeApp({credential:admin.credential.cert(c),projectId:process.env.EMULATOR_PROJECT_ID});
          (async()=>{
            const db=admin.firestore();
            await db.doc('_restoreTestProbe/probe').set({kind:'extra-before-exact'});
            await db.doc('_restoreTestProbe/probe/nested/child').set({kind:'nested-extra-before-exact'});
            await admin.auth().createUser({uid:process.env.PROBE_UID,email:`${process.env.PROBE_UID}@invalid.example`,disabled:true});
            console.log('Sonde emulator create.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          PROJECT_ID="${EMULATOR_PROJECT_ID}" \
          BACKUP_PROJECT_ID="${PROD_PROJECT_ID}" \
          BACKUP_PATH="${BACKUP_PATH_ABS}" \
          BACKUP_FORMAT=v3 \
          FIRESTORE_MODE=exact \
          AUTH_MODE=replace \
          VERIFY_RESTORE=1 \
          REQUIRE_DIFFERENT_TARGET=1 \
          RIFLESSA_RESTORE_EMULATOR=1 \
          RESTORE_HOSTING_DIR="${RESTORE_ROOT}" \
          node "${RESTORE_SCRIPT}"

          node <<'NODE'
          const admin=require('firebase-admin');
          const c=JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);
          admin.initializeApp({credential:admin.credential.cert(c),projectId:process.env.EMULATOR_PROJECT_ID},'verify');
          (async()=>{
            const db=admin.app('verify').firestore();
            for(const p of ['_restoreTestProbe/probe','_restoreTestProbe/probe/nested/child']){
              const s=await db.doc(p).get();
              if(s.exists)throw new Error(`Sonda Firestore non eliminata: ${p}`);
            }
            const auth=admin.app('verify').auth();
            try{await auth.getUser(process.env.PROBE_UID);throw new Error('Sonda Auth non eliminata');}
            catch(e){if(e.code!=='auth/user-not-found')throw e;}
            console.log('Exact verificato: sonde Firestore e Auth eliminate.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          test -f "${RESTORE_ROOT}/hosting-manifest.json"
          test -d "${RESTORE_ROOT}/hosting"
          test -d "${RESTORE_ROOT}/app-config"
          rsync -a --delete "${RESTORE_ROOT}/hosting/" "${EMULATOR_ROOT}/site/public/"
          test -f "${EMULATOR_ROOT}/site/public/index.html"

          SOURCE_SHA="$(sha256sum "${EMULATOR_ROOT}/site/public/index.html" | awk '{print $1}')"
          SERVED="${EMULATOR_ROOT}/served-index.html"
          OK=0
          for _ in $(seq 1 20); do
            if curl -fsS 'http://127.0.0.1:5007/' -o "${SERVED}"; then OK=1; break; fi
            sleep 1
          done
          [[ ${OK} -eq 1 ]] || { echo 'Hosting Emulator non raggiungibile'; exit 1; }
          SERVED_SHA="$(sha256sum "${SERVED}" | awk '{print $1}')"
          [[ "${SOURCE_SHA}" == "${SERVED_SHA}" ]] || { echo "Hash Hosting diverso: ${SOURCE_SHA}/${SERVED_SHA}"; exit 1; }
          echo "Hosting Emulator verificato: ${SERVED_SHA}"
          BASH
          chmod +x "${ROOT}/run-e2e.sh"
          echo "root=${ROOT}" >> "${GITHUB_OUTPUT}"

      - name: Esegue restore completo dentro gli emulatori
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/restore-tool/node_modules
          BACKUP_PATH_ABS: ${{ github.workspace }}/backup-repo/${{ steps.backup.outputs.path }}
          RESTORE_SCRIPT: ${{ github.workspace }}/workflow-src/scripts/ripristino-registratore.cjs
          RESTORE_ROOT: ${{ runner.temp }}/riflessa-emulator-e2e/restored
          EMULATOR_ROOT: ${{ runner.temp }}/riflessa-emulator-e2e
        run: |
          set -euo pipefail
          ROOT="${{ steps.prepare.outputs.root }}"
          CLI="${RUNNER_TEMP}/firebase-cli/node_modules/.bin/firebase"
          cd "${ROOT}"
          "${CLI}" emulators:exec \
            --only firestore,auth,hosting \
            --project "${EMULATOR_PROJECT_ID}" \
            --config firebase.json \
            "bash '${ROOT}/run-e2e.sh'"

      - name: Riepilogo
        run: |
          echo "Backup testato: ${{ steps.backup.outputs.name }}"
          echo "Target: ${EMULATOR_PROJECT_ID}, Firebase Emulator Suite isolata."
          echo 'Verificati: decrypt AES-GCM, Firestore exact incluse eliminazioni annidate, logs, Auth replace, rilettura, ricostruzione Hosting e file servito da Hosting Emulator.'
