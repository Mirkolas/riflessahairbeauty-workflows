name: Build EXE - registratore

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-exe-registratore.yml"

permissions:
  contents: read

concurrency:
  group: build-exe-registratore-signing-v4
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

jobs:
  verifica-versione:
    name: Verifica nuova versione privata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      portable_name: ${{ steps.check.outputs.portable_name }}
      installer_name: ${{ steps.check.outputs.installer_name }}
    steps:
      - name: Verifica configurazione protetta
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_PAT" || { echo '::error::PUBLIC_REPO_TOKEN mancante'; exit 1; }
          test -n "$GOOGLE_CREDENTIALS_JSON" || { echo '::error::FIREBASE_SERVICE_ACCOUNT mancante'; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo '::error::FIREBASE_PROJECT_ID mancante'; exit 1; }

      - name: Checkout sorgente privato
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Controlla release privata e canale Firestore Spark
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          set -euo pipefail
          cd "source/${APP_DIR}"
          VERSION="$(node -p "require('./package.json').version")"
          SOURCE_SHA="$(git -C ../.. rev-parse HEAD)"
          TAG="registratore-v${VERSION}"
          PORTABLE="riflessa-app-${VERSION}.exe"
          INSTALLER="RiflessaRegistratore-Setup-${VERSION}-x64.exe"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "portable_name=${PORTABLE}" >> "$GITHUB_OUTPUT"
          echo "installer_name=${INSTALLER}" >> "$GITHUB_OUTPUT"

          RELEASE_JSON=""
          if RELEASE_RESPONSE="$(gh api "repos/${SOURCE_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null)"; then
            RELEASE_JSON="$RELEASE_RESPONSE"
          fi
          RELEASE_COMPLETE=false
          if [[ -n "$RELEASE_JSON" ]]; then
            RELEASE_TARGET="$(jq -r '.target_commitish // empty' <<<"$RELEASE_JSON")"
            if [[ "$RELEASE_TARGET" != "$SOURCE_SHA" ]]; then
              echo "::error::La release ${TAG} esiste per il commit ${RELEASE_TARGET:-sconosciuto}, ma main punta a ${SOURCE_SHA}. Incrementare la versione prima di pubblicare sorgente diversa."
              exit 1
            fi

            asset_ok() {
              local name="$1"
              local min_size="$2"
              jq -e --arg name "$name" --argjson min "$min_size" \
                '.assets[] | select(.name == $name and .state == "uploaded" and .size >= $min)' \
                <<<"$RELEASE_JSON" >/dev/null
            }

            if asset_ok "$PORTABLE" 10485760 \
              && asset_ok "$INSTALLER" 10485760 \
              && asset_ok "$INSTALLER.blockmap" 1 \
              && asset_ok "latest.yml" 1; then
              RELEASE_COMPLETE=true
            fi
          fi

          TOKEN="$(gcloud auth print-access-token)"
          FIRESTORE_URL="https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/appUpdateChannels/stable"
          FIRESTORE_JSON="$(curl -sS -H "Authorization: Bearer $TOKEN" "$FIRESTORE_URL" || true)"
          CURRENT_VERSION="$(jq -r '.fields.version.stringValue // empty' <<<"$FIRESTORE_JSON" 2>/dev/null || true)"
          CURRENT_SOURCE_SHA="$(jq -r '.fields.sourceSha.stringValue // empty' <<<"$FIRESTORE_JSON" 2>/dev/null || true)"
          FIRESTORE_READY=false
          if [[ "$CURRENT_VERSION" == "$VERSION" ]]; then
            if [[ "$CURRENT_SOURCE_SHA" != "$SOURCE_SHA" ]]; then
              echo "::error::Il canale Firestore dichiara la versione ${VERSION} ma appartiene al commit ${CURRENT_SOURCE_SHA:-sconosciuto}; sorgente corrente ${SOURCE_SHA}. Incrementare la versione o correggere il canale prima di proseguire."
              exit 1
            fi
            FIRESTORE_READY=true
          fi

          echo "Release completa: $RELEASE_COMPLETE"
          echo "Firestore corrente: ${CURRENT_VERSION:-nessuna}"
          if [[ "$RELEASE_COMPLETE" != 'true' || "$FIRESTORE_READY" != 'true' ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Release privata $TAG e canale Firestore già completi e coerenti con ${SOURCE_SHA}."
          fi

  build-windows:
    name: Build Windows firmata e update privato Spark
    needs: verifica-versione
    if: needs.verifica-versione.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    concurrency:
      group: firebase-backup-registratore
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.verifica-versione.outputs.version }}
      SOURCE_SHA: ${{ needs.verifica-versione.outputs.source_sha }}
      PORTABLE_NAME: ${{ needs.verifica-versione.outputs.portable_name }}
      INSTALLER_NAME: ${{ needs.verifica-versione.outputs.installer_name }}
    steps:
      - name: Checkout versione esatta
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source/${{ env.APP_DIR }}/package-lock.json

      - name: Test e preflight
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Installazione dipendenze fallita' }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw 'Audit dipendenze: vulnerabilita alta o critica' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Test falliti' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Check progetto fallito' }
          node scripts/release-preflight.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Release preflight fallito' }

      - name: Prepara certificato firma
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) { throw 'PFX mancante' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)) { throw 'Password PFX mancante' }
          $pfx = Join-Path $env:RUNNER_TEMP 'riflessa-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:WINDOWS_CODESIGN_PFX_PASSWORD, $flags)
          if (-not $cert.HasPrivateKey) { throw 'Il PFX non contiene chiave privata' }
          if ($cert.Subject -ne 'CN=Riflessa Hair & Beauty') { throw "Certificato inatteso: $($cert.Subject)" }
          "CODESIGN_PFX_PATH=$pfx" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CODESIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Genera Portable e NSIS
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CSC_LINK = $env:CODESIGN_PFX_PATH
          $env:CSC_KEY_PASSWORD = $env:WINDOWS_CODESIGN_PFX_PASSWORD
          Remove-Item Env:CSC_IDENTITY_AUTO_DISCOVERY -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path release-out | Out-Null

          npx electron-builder --win portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Build Portable fallita' }
          $portable = @(Get-ChildItem dist -Filter 'RiflessaRegistratore-Setup-*.exe' -File)
          if ($portable.Count -ne 1) { throw "Portable non trovata o ambigua: $($portable.Count)" }
          Move-Item $portable[0].FullName (Join-Path release-out $env:PORTABLE_NAME) -Force

          Remove-Item -Recurse -Force dist\win-unpacked -ErrorAction SilentlyContinue
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Build NSIS fallita' }

          $installer = Get-Item (Join-Path dist $env:INSTALLER_NAME) -ErrorAction Stop
          $blockmap = Get-Item (Join-Path dist "$env:INSTALLER_NAME.blockmap") -ErrorAction Stop
          $latest = Get-Item dist\latest.yml -ErrorAction Stop
          $portableFinal = Get-Item (Join-Path release-out $env:PORTABLE_NAME) -ErrorAction Stop
          "INSTALLER=$($installer.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BLOCKMAP=$($blockmap.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LATEST=$($latest.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE=$($portableFinal.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verifica firme e metadata
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @($env:PORTABLE, $env:INSTALLER)) {
            $item = Get-Item $file -ErrorAction Stop
            if ($item.Length -lt 10MB) { throw "Eseguibile troppo piccolo: $($item.Name)" }
            $sig = Get-AuthenticodeSignature $item.FullName
            if (-not $sig.SignerCertificate) { throw "Non firmato: $($item.Name)" }
            if ($sig.SignerCertificate.Subject -ne 'CN=Riflessa Hair & Beauty') { throw "Firmatario inatteso: $($item.Name)" }
            if ($sig.SignerCertificate.Thumbprint -ne $env:CODESIGN_THUMBPRINT) { throw "Thumbprint inatteso: $($item.Name)" }
          }
          $inner = Get-Item dist\win-unpacked\Riflessabeautyapp.exe -ErrorAction Stop
          $innerSig = Get-AuthenticodeSignature $inner.FullName
          if (-not $innerSig.SignerCertificate -or $innerSig.SignerCertificate.Thumbprint -ne $env:CODESIGN_THUMBPRINT) { throw 'EXE interno non firmato correttamente' }
          $yaml = Get-Content $env:LATEST -Raw
          if ($yaml -notmatch [regex]::Escape($env:INSTALLER_NAME)) { throw 'latest.yml non punta all installer' }
          if ($yaml -notmatch 'sha512:') { throw 'latest.yml privo di SHA512' }
          if ($yaml -notmatch "version:\s*$([regex]::Escape($env:VERSION))") { throw 'Versione latest.yml inattesa' }
          $sha512 = [System.Security.Cryptography.SHA512]::Create()
          $installerStream = [IO.File]::OpenRead($env:INSTALLER)
          try { $expectedSha512 = [Convert]::ToBase64String($sha512.ComputeHash($installerStream)) }
          finally { $installerStream.Dispose(); $sha512.Dispose() }
          if ($yaml -notmatch [regex]::Escape($expectedSha512)) { throw 'SHA512 latest.yml diverso dal contenuto installer' }
          Write-Host "Installer SHA256: $((Get-FileHash $env:INSTALLER -Algorithm SHA256).Hash)"

      - name: Pubblica release PRIVATA completa
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "registratore-v$env:VERSION"
          $title = "Riflessa Registratore v$env:VERSION"
          $notes = "Build Windows firmata. Portable + NSIS + metadata auto-update privati Firestore/Spark. Commit sorgente: $env:SOURCE_SHA"
          $assets = @($env:PORTABLE, $env:INSTALLER, $env:BLOCKMAP, $env:LATEST)
          gh release view $tag --repo $env:SOURCE_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:SOURCE_REPOSITORY
          } else {
            gh release create $tag @assets --repo $env:SOURCE_REPOSITORY --target $env:SOURCE_SHA --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Pubblicazione release privata fallita' }

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Pubblica update su Firestore Spark
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $token = (& gcloud auth print-access-token).Trim()
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'Access token Google mancante' }
          $env:FIRESTORE_ACCESS_TOKEN = $token
          try {
            node scripts/publish-update-firestore.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Pubblicazione Firestore update fallita' }
          } finally {
            Remove-Item Env:FIRESTORE_ACCESS_TOKEN -ErrorAction SilentlyContinue
          }

      - name: Elimina certificato temporaneo
        if: always()
        shell: pwsh
        run: |
          if ($env:CODESIGN_PFX_PATH) { Remove-Item $env:CODESIGN_PFX_PATH -Force -ErrorAction SilentlyContinue }
