name: Build EXE - registratore

# Trigger produzione registratore 3.5.5 definitiva
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-exe-registratore.yml"

permissions:
  contents: read

concurrency:
  group: build-exe-registratore-signing-v2
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}

jobs:
  verifica-versione:
    name: Verifica nuova versione
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      portable_name: ${{ steps.check.outputs.portable_name }}
    steps:
      - name: Verifica secret repo privata
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_PAT}" || { echo "PUBLIC_REPO_TOKEN mancante"; exit 1; }

      - name: Checkout sorgente privato
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Controlla se la Portable della versione esiste gia
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
          FORCE_BUILD: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          cd "source/${APP_DIR}"
          VERSION="$(node -p "require('./package.json').version")"
          SOURCE_SHA="$(git -C ../.. rev-parse HEAD)"
          TAG="registratore-v${VERSION}"
          PORTABLE="riflessa-app-${VERSION}.exe"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "portable_name=${PORTABLE}" >> "$GITHUB_OUTPUT"

          ASSETS="$(gh release view "${TAG}" --repo "${SOURCE_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if [[ "${FORCE_BUILD}" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Build forzata: genero nuovamente ${PORTABLE} e sostituisco l'asset della release."
          elif printf '%s\n' "${ASSETS}" | grep -Fxq "${PORTABLE}"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Versione ${VERSION}: ${PORTABLE} gia presente nella release privata."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Versione ${VERSION}: Portable da generare/pubblicare."
          fi

  build-windows:
    name: Build Windows x64 Portable firmata
    needs: verifica-versione
    if: needs.verifica-versione.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.verifica-versione.outputs.version }}
      SOURCE_SHA: ${{ needs.verifica-versione.outputs.source_sha }}
      PORTABLE_NAME: ${{ needs.verifica-versione.outputs.portable_name }}
    steps:
      - name: Checkout versione esatta della repo privata
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa dipendenze
        working-directory: source/${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Esegui test
        working-directory: source/${{ env.APP_DIR }}
        run: npm test

      - name: Verifica progetto
        working-directory: source/${{ env.APP_DIR }}
        run: npm run check

      - name: Prepara PFX temporaneo di firma
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) { throw "WINDOWS_CODESIGN_PFX_BASE64 mancante" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)) { throw "WINDOWS_CODESIGN_PFX_PASSWORD mancante" }

          $pfxPath = Join-Path $env:RUNNER_TEMP "riflessa-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          } catch {
            throw "WINDOWS_CODESIGN_PFX_BASE64 non valido"
          }

          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $expected = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:WINDOWS_CODESIGN_PFX_PASSWORD, $flags)
          if (-not $expected.HasPrivateKey) { throw "Il PFX non contiene la chiave privata" }
          if ($expected.Subject -ne "CN=Riflessa Hair & Beauty") { throw "Certificato inatteso: $($expected.Subject)" }

          "CODESIGN_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CODESIGN_THUMBPRINT=$($expected.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PFX di firma validato: Riflessa Hair & Beauty"

      - name: Genera EXE Portable firmata
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "release-out" | Out-Null

          $env:CSC_LINK = $env:CODESIGN_PFX_PATH
          $env:CSC_KEY_PASSWORD = $env:WINDOWS_CODESIGN_PFX_PASSWORD
          Remove-Item Env:CSC_IDENTITY_AUTO_DISCOVERY -ErrorAction SilentlyContinue

          npm run portable -- --publish never
          if ($LASTEXITCODE -ne 0) { throw "Build Portable fallita" }

          $generated = @(Get-ChildItem -Path "dist" -Filter "RiflessaRegistratore-Setup-*.exe" -File)
          if ($generated.Count -ne 1) { throw "Portable generata non trovata o ambigua: $($generated.Count)" }
          Move-Item $generated[0].FullName (Join-Path "release-out" $env:PORTABLE_NAME) -Force

      - name: Verifica firma digitale e EXE Portable
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = "Stop"
          $portable = Get-Item (Join-Path "release-out" $env:PORTABLE_NAME)
          if ($portable.Length -lt 10MB) { throw "Portable troppo piccola: $($portable.Length)" }

          $signature = Get-AuthenticodeSignature -FilePath $portable.FullName
          if (-not $signature.SignerCertificate) { throw "EXE Portable non firmata" }
          if ($signature.SignerCertificate.Subject -ne "CN=Riflessa Hair & Beauty") {
            throw "Firmatario inatteso: $($signature.SignerCertificate.Subject)"
          }
          if ($signature.SignerCertificate.Thumbprint -ne $env:CODESIGN_THUMBPRINT) {
            throw "Thumbprint della firma non corrispondente al certificato configurato"
          }

          $inner = Get-Item "dist\win-unpacked\Riflessabeautyapp.exe" -ErrorAction Stop
          $innerSignature = Get-AuthenticodeSignature -FilePath $inner.FullName
          if (-not $innerSignature.SignerCertificate) { throw "Eseguibile interno Electron non firmato" }
          if ($innerSignature.SignerCertificate.Subject -ne "CN=Riflessa Hair & Beauty") {
            throw "Firmatario interno inatteso: $($innerSignature.SignerCertificate.Subject)"
          }
          if ($innerSignature.SignerCertificate.Thumbprint -ne $env:CODESIGN_THUMBPRINT) {
            throw "Thumbprint della firma interna non corrispondente"
          }

          Write-Host "Portable firmata correttamente: $($portable.Name)"
          Write-Host "Firmatario: $($signature.SignerCertificate.Subject)"
          Write-Host "Scadenza certificato: $($signature.SignerCertificate.NotAfter)"
          Write-Host "Stato trust runner: $($signature.Status)"
          Write-Host "Dimensione: $([math]::Round($portable.Length / 1MB, 2)) MB"
          Write-Host "SHA256: $((Get-FileHash $portable.FullName -Algorithm SHA256).Hash)"

      - name: Pubblica Portable firmata nella release PRIVATA dell'app
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "registratore-v$env:VERSION"
          $portable = Join-Path "release-out" $env:PORTABLE_NAME
          $title = "Riflessa Registratore v$env:VERSION"
          $notes = "Build Windows x64 Portable firmata con Riflessa Hair & Beauty. File ufficiale: $env:PORTABLE_NAME. Commit sorgente: $env:SOURCE_SHA"
          $published = $false

          for ($attempt = 1; $attempt -le 5 -and -not $published; $attempt++) {
            Write-Host "Tentativo pubblicazione $attempt/5"
            gh release view $tag --repo $env:SOURCE_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $portable --clobber --repo $env:SOURCE_REPOSITORY
              if ($LASTEXITCODE -eq 0) { $published = $true; break }
            } else {
              gh release create $tag $portable --repo $env:SOURCE_REPOSITORY --target $env:SOURCE_SHA --title $title --notes $notes
              if ($LASTEXITCODE -eq 0) { $published = $true; break }
            }
            if ($attempt -lt 5) { Start-Sleep -Seconds (10 * $attempt) }
          }

          if (-not $published) { throw "Pubblicazione release fallita dopo 5 tentativi" }
          Write-Host "Release privata pronta: $tag / $env:PORTABLE_NAME"

      - name: Elimina PFX temporaneo dal runner
        if: always()
        shell: pwsh
        run: |
          if ($env:CODESIGN_PFX_PATH) {
            Remove-Item $env:CODESIGN_PFX_PATH -Force -ErrorAction SilentlyContinue
          }
