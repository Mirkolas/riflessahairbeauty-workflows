name: Build EXE - registratore

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-exe-registratore.yml"

permissions:
  contents: read

concurrency:
  group: build-exe-registratore
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}

jobs:
  verifica-versione:
    name: Verifica nuova versione
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      portable_name: ${{ steps.check.outputs.portable_name }}
    steps:
      - name: Verifica secret repo privata
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_PAT}" || { echo "PUBLIC_REPO_TOKEN mancante"; exit 1; }

      - name: Checkout sorgente privato
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Controlla se la Portable della versione esiste gia
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          set -euo pipefail
          cd "source/${APP_DIR}"
          VERSION="$(node -p "require('./package.json').version")"
          SOURCE_SHA="$(git -C ../.. rev-parse HEAD)"
          TAG="registratore-v${VERSION}"
          PORTABLE="riflessa-app-${VERSION}.exe"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "portable_name=${PORTABLE}" >> "$GITHUB_OUTPUT"

          ASSETS="$(gh release view "${TAG}" --repo "${SOURCE_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if printf '%s\n' "${ASSETS}" | grep -Fxq "${PORTABLE}"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Versione ${VERSION}: ${PORTABLE} gia presente nella release privata."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Versione ${VERSION}: Portable da generare/pubblicare."
          fi

  build-windows:
    name: Build Windows x64 Portable
    needs: verifica-versione
    if: needs.verifica-versione.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.verifica-versione.outputs.version }}
      SOURCE_SHA: ${{ needs.verifica-versione.outputs.source_sha }}
      PORTABLE_NAME: ${{ needs.verifica-versione.outputs.portable_name }}
    steps:
      - name: Checkout versione esatta della repo privata
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa dipendenze
        working-directory: source/${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Esegui test
        working-directory: source/${{ env.APP_DIR }}
        run: npm test

      - name: Verifica progetto
        working-directory: source/${{ env.APP_DIR }}
        run: npm run check

      - name: Genera EXE Portable
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "release-out" | Out-Null
          npm run portable
          if ($LASTEXITCODE -ne 0) { throw "Build Portable fallita" }
          $generated = @(Get-ChildItem -Path "dist" -Filter "RiflessaRegistratore-Setup-*.exe" -File)
          if ($generated.Count -ne 1) { throw "Portable generata non trovata o ambigua: $($generated.Count)" }
          Move-Item $generated[0].FullName (Join-Path "release-out" $env:PORTABLE_NAME) -Force

      - name: Verifica EXE Portable generato
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        run: |
          $portable = Get-Item (Join-Path "release-out" $env:PORTABLE_NAME)
          if ($portable.Length -lt 10MB) { throw "Portable troppo piccola: $($portable.Length)" }
          Write-Host "Portable: $($portable.Name) - $([math]::Round($portable.Length / 1MB, 2)) MB"
          Write-Host "SHA256 portable: $((Get-FileHash $portable.FullName -Algorithm SHA256).Hash)"

      - name: Pubblica Portable nella release PRIVATA dell'app
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "registratore-v$env:VERSION"
          $portable = Join-Path "release-out" $env:PORTABLE_NAME
          $title = "Riflessa Registratore v$env:VERSION"
          $notes = "Build Windows x64 Portable del registratore. File ufficiale: $env:PORTABLE_NAME. Commit sorgente: $env:SOURCE_SHA"
          $published = $false

          for ($attempt = 1; $attempt -le 5 -and -not $published; $attempt++) {
            Write-Host "Tentativo pubblicazione $attempt/5"
            gh release view $tag --repo $env:SOURCE_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $portable --clobber --repo $env:SOURCE_REPOSITORY
              if ($LASTEXITCODE -eq 0) { $published = $true; break }
            } else {
              gh release create $tag $portable --repo $env:SOURCE_REPOSITORY --target $env:SOURCE_SHA --title $title --notes $notes
              if ($LASTEXITCODE -eq 0) { $published = $true; break }
            }
            if ($attempt -lt 5) { Start-Sleep -Seconds (10 * $attempt) }
          }

          if (-not $published) { throw "Pubblicazione release fallita dopo 5 tentativi" }
          Write-Host "Release privata pronta: $tag / $env:PORTABLE_NAME"
