name: Release privata registratore

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ricrea la release privata anche se esiste già'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-auto-update-registratore.yml'

permissions:
  contents: read

concurrency:
  group: release-privata-registratore
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  TARGET_REPOSITORY: Mirkolas/riflessahairbeauty
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}

jobs:
  prepare:
    name: Verifica nuova versione privata
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    steps:
      - name: Verifica accesso repository privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_PAT" || { echo '::error::PUBLIC_REPO_TOKEN mancante'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Controlla versione e release privata
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./source/${APP_DIR}/package.json').version")"
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE" == 'true' ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo "Release privata $VERSION forzata."
          elif gh release view "$VERSION" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Release privata $VERSION già presente."
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo "Nuova release privata da creare: $VERSION / $SOURCE_SHA"
          fi

  build-release:
    name: Firma e pubblica NSIS nella repo privata
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      GH_TOKEN: ${{ env.SOURCE_PAT }}
    steps:
      - name: Checkout sorgente privato esatto
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze e verifica release
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          npm test
          npm run check
          node scripts/release-preflight.cjs
      - name: Prepara certificato di firma
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) { throw 'WINDOWS_CODESIGN_PFX_BASE64 mancante' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)) { throw 'WINDOWS_CODESIGN_PFX_PASSWORD mancante' }
          $pfx = Join-Path $env:RUNNER_TEMP 'riflessa-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:WINDOWS_CODESIGN_PFX_PASSWORD, $flags)
          if (-not $cert.HasPrivateKey) { throw 'Il PFX non contiene la chiave privata' }
          if ($cert.Subject -ne 'CN=Riflessa Hair & Beauty') { throw "Certificato inatteso: $($cert.Subject)" }
          "CODESIGN_PFX_PATH=$pfx" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CODESIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Genera installer NSIS firmato
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CSC_LINK = $env:CODESIGN_PFX_PATH
          $env:CSC_KEY_PASSWORD = $env:WINDOWS_CODESIGN_PFX_PASSWORD
          Remove-Item Env:CSC_IDENTITY_AUTO_DISCOVERY -ErrorAction SilentlyContinue
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Build NSIS fallita' }
      - name: Verifica firma e pacchetto
        shell: pwsh
        working-directory: source/${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installerName = "RiflessaRegistratore-Setup-$env:VERSION-x64.exe"
          $installer = Get-Item (Join-Path 'dist' $installerName) -ErrorAction Stop
          $latest = Get-Item 'dist/latest.yml' -ErrorAction Stop
          $blockmap = Get-Item (Join-Path 'dist' "$installerName.blockmap") -ErrorAction Stop
          if ($installer.Length -lt 10MB) { throw "Installer troppo piccolo: $($installer.Length)" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if (-not $signature.SignerCertificate) { throw 'Installer NSIS non firmato' }
          if ($signature.SignerCertificate.Subject -ne 'CN=Riflessa Hair & Beauty') { throw "Firmatario inatteso: $($signature.SignerCertificate.Subject)" }
          if ($signature.SignerCertificate.Thumbprint -ne $env:CODESIGN_THUMBPRINT) { throw 'Thumbprint installer non corrispondente' }
          $inner = Get-Item 'dist/win-unpacked/Riflessabeautyapp.exe' -ErrorAction Stop
          $innerSig = Get-AuthenticodeSignature $inner.FullName
          if (-not $innerSig.SignerCertificate -or $innerSig.SignerCertificate.Thumbprint -ne $env:CODESIGN_THUMBPRINT) { throw 'Eseguibile Electron interno non firmato col certificato atteso' }
          $yaml = Get-Content $latest.FullName -Raw
          if ($yaml -notmatch [regex]::Escape($installerName)) { throw 'latest.yml non punta all installer atteso' }
          if ($yaml -notmatch 'sha512:') { throw 'latest.yml privo di SHA512' }
          if ($yaml -notmatch "version:\s*$([regex]::Escape($env:VERSION))") { throw 'latest.yml contiene versione inattesa' }
          "INSTALLER=$($installer.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BLOCKMAP=$($blockmap.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LATEST=$($latest.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer verificato: $installerName"
          Write-Host "SHA256: $((Get-FileHash $installer.FullName -Algorithm SHA256).Hash)"
      - name: Pubblica release nella repo privata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:VERSION
          $title = "Riflessa Registratore $env:VERSION"
          $notes = "Release Windows x64 firmata digitalmente da Riflessa Hair & Beauty. Sorgente: commit $env:SOURCE_SHA. Distribuzione privata."
          gh release view $tag --repo $env:TARGET_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:INSTALLER $env:BLOCKMAP $env:LATEST --clobber --repo $env:TARGET_REPOSITORY
          } else {
            gh release create $tag $env:INSTALLER $env:BLOCKMAP $env:LATEST --repo $env:TARGET_REPOSITORY --target $env:SOURCE_SHA --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Pubblicazione release privata fallita' }
      - name: Elimina certificato temporaneo
        if: always()
        shell: pwsh
        run: |
          if ($env:CODESIGN_PFX_PATH) { Remove-Item $env:CODESIGN_PFX_PATH -Force -ErrorAction SilentlyContinue }
