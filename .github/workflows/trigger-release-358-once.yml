name: Avvia release auto update 3.5.8 una tantum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-release-358-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia workflow release permanente
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-auto-update-registratore.yml --repo "$GITHUB_REPOSITORY"
