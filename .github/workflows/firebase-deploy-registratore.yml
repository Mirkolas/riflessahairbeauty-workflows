name: Firebase deploy - registratore

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag o commit della repo applicativa da pubblicare"
        required: true
        default: "main"
        type: string
  repository_dispatch:
    types: [firebase-deploy-registratore]

permissions:
  contents: read

concurrency:
  group: firebase-deploy-registratore
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  HOSTING_TARGET: ${{ vars.FIREBASE_HOSTING_TARGET }}
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  deploy:
    name: Deploy Firebase registratore
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verifica configurazione protetta
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PROJECT_ID}" ]] || { echo "::error::Manca la Variable FIREBASE_PROJECT_ID."; exit 1; }
          [[ "${HOSTING_TARGET}" == "registratore" ]] || { echo "::error::FIREBASE_HOSTING_TARGET deve essere registratore."; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo "::error::Manca il Secret PUBLIC_REPO_TOKEN nella repository che esegue il workflow."; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo "::error::Manca il Secret FIREBASE_SERVICE_ACCOUNT."; exit 1; }

      - name: Determina ref applicazione
        id: source
        shell: bash
        env:
          MANUAL_REF: ${{ inputs.ref }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
        run: |
          set -euo pipefail
          REF="${MANUAL_REF:-${DISPATCH_REF:-main}}"
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"

      - name: Checkout applicazione
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ env.SOURCE_PAT }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa dipendenze
        working-directory: app/riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Esegui test
        working-directory: app/riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
        shell: bash
        run: npm test

      - name: Verifica progetto
        working-directory: app/riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
        shell: bash
        run: npm run check

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Hosting registratore
        working-directory: app/riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase deploy \
            --project "${PROJECT_ID}" \
            --only "hosting:${HOSTING_TARGET}" \
            --non-interactive
