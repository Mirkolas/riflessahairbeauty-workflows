name: Smoke test Firebase registratore

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_smoke-test-registratore.yml"

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  BACKUP_BUCKET: ${{ vars.FIREBASE_PROJECT_ID }}-firestore-backups

jobs:
  test:
    name: Test Firebase registratore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verifica configurazione Firebase
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PROJECT_ID}" ]] || { echo "::error::FIREBASE_PROJECT_ID assente"; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo "::error::FIREBASE_SERVICE_ACCOUNT assente"; exit 1; }

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Installa Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verifica accesso Firestore
        shell: bash
        run: |
          set -euo pipefail
          gcloud firestore databases describe \
            --database='(default)' \
            --project="${PROJECT_ID}" \
            --format='value(name)' >/dev/null
          echo "Accesso Firestore: OK"

      - name: Prepara bucket backup
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud storage buckets describe "gs://${BACKUP_BUCKET}" >/dev/null 2>&1; then
            DB_LOCATION="$(gcloud firestore databases describe --database='(default)' --project="${PROJECT_ID}" --format='value(locationId)')"
            case "${DB_LOCATION}" in
              nam5) BUCKET_LOCATION="US" ;;
              eur3) BUCKET_LOCATION="EU" ;;
              *) BUCKET_LOCATION="${DB_LOCATION}" ;;
            esac
            gcloud storage buckets create "gs://${BACKUP_BUCKET}" \
              --project="${PROJECT_ID}" \
              --location="${BUCKET_LOCATION}" \
              --uniform-bucket-level-access
          fi
          echo "Bucket backup accessibile: OK"

      - name: Export Firestore temporaneo
        id: export
        shell: bash
        run: |
          set -euo pipefail
          NAME="smoke-${GITHUB_RUN_ID}-$(date -u +'%Y%m%d-%H%M%S')"
          URI="gs://${BACKUP_BUCKET}/registratore/smoke/${NAME}"
          gcloud firestore export "${URI}" \
            --database='(default)' \
            --project="${PROJECT_ID}" \
            --quiet
          gcloud storage ls "${URI}/${NAME}.overall_export_metadata" >/dev/null
          echo "uri=${URI}" >> "${GITHUB_OUTPUT}"
          echo "Export Firestore temporaneo: OK"

      - name: Verifica sito Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@13.20.0 hosting:sites:list \
            --project "${PROJECT_ID}" \
            --json > sites.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('sites.json', 'utf8'));
          const rows = Array.isArray(data.result) ? data.result : (data.result?.sites || []);
          const found = rows.some(x => x.name === 'riflessa-15a20' || x.site === 'riflessa-15a20' || String(x.defaultUrl || '').includes('riflessa-15a20'));
          if (!found) throw new Error('Sito Firebase Hosting riflessa-15a20 non trovato');
          console.log('Firebase Hosting riflessa-15a20: OK');
          NODE

      - name: Pulisci export temporaneo
        if: always() && steps.export.outputs.uri != ''
        shell: bash
        run: gcloud storage rm --recursive "${{ steps.export.outputs.uri }}" || true
