name: Smoke test completo registratore

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_smoke-test-registratore.yml"

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  CONFIGURED_TARGET: ${{ vars.FIREBASE_HOSTING_TARGET }}
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  test:
    name: Test completo registratore
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verifica nomi configurati
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PROJECT_ID}" ]] || { echo "::error::FIREBASE_PROJECT_ID assente"; exit 1; }
          [[ "${CONFIGURED_TARGET}" == "registratore" ]] || { echo "::error::FIREBASE_HOSTING_TARGET deve essere registratore"; exit 1; }
          [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]] || { echo "::error::FIREBASE_SERVICE_ACCOUNT assente"; exit 1; }
          [[ -n "${SOURCE_PAT}" ]] || { echo "::error::PUBLIC_REPO_TOKEN non disponibile in riflessahairbeauty-workflows"; exit 1; }
          echo "Secrets/Variables richiesti: OK"

      - name: Checkout repository privata
        uses: actions/checkout@v4
        with:
          repository: Mirkolas/riflessahairbeauty
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Verifica mapping target registratore
        working-directory: app/riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const rc = JSON.parse(fs.readFileSync('.firebaserc', 'utf8'));
          const cfg = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const project = process.env.PROJECT_ID;
          if (cfg.hosting?.target !== 'registratore') throw new Error('firebase.json target diverso da registratore');
          const mapped = rc.targets?.[project]?.hosting?.registratore || [];
          if (!mapped.includes('riflessa-15a20')) throw new Error('registratore non mappa a riflessa-15a20');
          console.log('Target registratore -> riflessa-15a20: OK');
          NODE

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test applicazione
        working-directory: app/riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run check

      - name: Installa Firebase Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firestore-smoke"
          cd "${RUNNER_TEMP}/firestore-smoke"
          npm init -y >/dev/null 2>&1
          npm install firebase-admin@13 --no-audit --no-fund

      - name: Test backup JSON Firestore
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/firestore-smoke/test.cjs" <<'NODE'
          const fs = require('fs');
          const admin = require('firebase-admin');
          const credentials = JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);
          admin.initializeApp({credential: admin.credential.cert(credentials), projectId: process.env.PROJECT_ID});
          const db = admin.firestore();

          function encode(value) {
            if (value === null || value === undefined) return value ?? null;
            if (value instanceof admin.firestore.Timestamp) return {__firestoreType:'timestamp',seconds:value.seconds,nanoseconds:value.nanoseconds};
            if (value instanceof admin.firestore.GeoPoint) return {__firestoreType:'geopoint',latitude:value.latitude,longitude:value.longitude};
            if (value instanceof admin.firestore.DocumentReference) return {__firestoreType:'reference',path:value.path};
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) return {__firestoreType:'bytes',base64:Buffer.from(value).toString('base64')};
            if (Array.isArray(value)) return value.map(encode);
            if (typeof value === 'object') { const o={}; for (const [k,v] of Object.entries(value)) o[k]=encode(v); return o; }
            return value;
          }
          function decode(value) {
            if (value === null || value === undefined) return value;
            if (Array.isArray(value)) return value.map(decode);
            if (typeof value !== 'object') return value;
            if (value.__firestoreType === 'timestamp') return new admin.firestore.Timestamp(value.seconds,value.nanoseconds);
            if (value.__firestoreType === 'geopoint') return new admin.firestore.GeoPoint(value.latitude,value.longitude);
            if (value.__firestoreType === 'reference') return db.doc(value.path);
            if (value.__firestoreType === 'bytes') return Buffer.from(value.base64,'base64');
            const o={}; for (const [k,v] of Object.entries(value)) o[k]=decode(v); return o;
          }

          const documents=[];
          async function walkCollection(collectionRef) {
            const snapshot=await collectionRef.get();
            for (const doc of snapshot.docs) {
              documents.push({path:doc.ref.path,data:encode(doc.data())});
              for (const sub of await doc.ref.listCollections()) await walkCollection(sub);
            }
          }
          (async()=>{
            for (const root of await db.listCollections()) await walkCollection(root);
            documents.sort((a,b)=>a.path.localeCompare(b.path));
            const backup={format:'riflessa-firestore-json-v1',projectId:process.env.PROJECT_ID,databaseId:'(default)',createdAt:new Date().toISOString(),documentCount:documents.length,documents};
            const file=process.env.RUNNER_TEMP + '/smoke-firestore.json';
            fs.writeFileSync(file, JSON.stringify(backup));
            const parsed=JSON.parse(fs.readFileSync(file,'utf8'));
            if (parsed.format !== 'riflessa-firestore-json-v1' || parsed.documentCount !== parsed.documents.length) throw new Error('Backup JSON non valido');
            for (const d of parsed.documents) { if (!d.path || typeof d.data !== 'object') throw new Error('Documento non valido'); decode(d.data); }
            console.log(`Backup JSON + dry-run restore: OK (${parsed.documentCount} documenti)`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node "${RUNNER_TEMP}/firestore-smoke/test.cjs"

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Installa Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verifica Firestore
        shell: bash
        run: |
          set -euo pipefail
          gcloud firestore databases describe --database='(default)' --project="${PROJECT_ID}" --format='value(name)' >/dev/null
          echo "Firestore: OK"

      - name: Verifica sito Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@13.20.0 hosting:sites:list --project "${PROJECT_ID}" --json > "${RUNNER_TEMP}/sites.json"
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/sites.json','utf8'));
          const rows=Array.isArray(d.result)?d.result:(d.result?.sites||[]);
          const ok=rows.some(x=>x.name==='riflessa-15a20'||x.site==='riflessa-15a20'||String(x.defaultUrl||'').includes('riflessa-15a20'));
          if(!ok) throw new Error('Sito riflessa-15a20 non trovato');
          console.log('Firebase Hosting riflessa-15a20: OK');
          NODE

# rerun after aligning application tests
