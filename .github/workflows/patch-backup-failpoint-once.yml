name: Patch failpoint backup una tantum

on:
  push:
    paths:
      - '.github/workflows/patch-backup-failpoint-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Aggiunge failpoint esplicito e disattivato di default
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/backup-registratore-v3.cjs')
          s=p.read_text()
          old="const PERSISTENT_CHECKPOINT_DIR = process.env.PERSISTENT_CHECKPOINT_DIR || '';\nconst JOURNAL_COLLECTION = '_backupChanges';"
          new="const PERSISTENT_CHECKPOINT_DIR = process.env.PERSISTENT_CHECKPOINT_DIR || '';\nconst TEST_STOP_AFTER_PHASE = String(process.env.TEST_STOP_AFTER_PHASE || '').trim();\nconst ALLOW_TEST_FAILPOINTS = String(process.env.ALLOW_TEST_FAILPOINTS || '') === '1';\nconst JOURNAL_COLLECTION = '_backupChanges';"
          if s.count(old)!=1:
              raise SystemExit(f'costanti failpoint: atteso 1 match, trovati {s.count(old)}')
          s=s.replace(old,new,1)
          old="async function main() {\n  await restorePersistentCheckpoint();\n  const state = initializeState();\n  await phaseFirestore(state);\n  await phaseAuth(state);\n  await phaseHosting(state);\n  await phaseLogs(state);\n  await finalize(state);\n}"
          new="function testStopAfter(phaseName) {\n  if (!TEST_STOP_AFTER_PHASE) return;\n  if (!ALLOW_TEST_FAILPOINTS) throw new Error('TEST_STOP_AFTER_PHASE richiede ALLOW_TEST_FAILPOINTS=1');\n  if (TEST_STOP_AFTER_PHASE === phaseName) {\n    const error = new Error(`TEST_FAILPOINT_AFTER_${phaseName.toUpperCase()}: arresto intenzionale dopo checkpoint persistito`);\n    error.code = 'RIFLESSA_TEST_FAILPOINT';\n    throw error;\n  }\n}\n\nasync function main() {\n  await restorePersistentCheckpoint();\n  const state = initializeState();\n  await phaseFirestore(state); testStopAfter('firestore');\n  await phaseAuth(state); testStopAfter('auth');\n  await phaseHosting(state); testStopAfter('hosting');\n  await phaseLogs(state); testStopAfter('logs');\n  await finalize(state);\n}"
          if s.count(old)!=1:
              raise SystemExit(f'main failpoint: atteso 1 match, trovati {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/backup-registratore-v3.cjs
          git diff --check
      - name: Commit patch e rimuovi workflow temporaneo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/backup-registratore-v3.cjs
          git rm .github/workflows/patch-backup-failpoint-once.yml
          git commit -m 'Aggiunge failpoint protetto per test resume backup'
          git push origin HEAD:main
