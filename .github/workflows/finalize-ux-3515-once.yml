name: Finalizza UX completa registratore 3.5.15 una tantum

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-ux-3515-once.yml"
      - "scripts/finalize-ux-3515.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  SOURCE_REPOSITORY: Mirkolas/riflessahairbeauty
  APP_DIR: riflessahairbeauty-app-registratore/Riflessabeautyapp_v3.5.2_receipt_actions
  SOURCE_PAT: ${{ secrets.PUBLIC_REPO_TOKEN }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verifica credenziale sorgente
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_PAT" || { echo '::error::PUBLIC_REPO_TOKEN mancante'; exit 1; }

      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout sorgente privato
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ env.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Applica UX 3.5.15
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize-ux-3515.py "source/${APP_DIR}"
          cd "source/${APP_DIR}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [[ "$CURRENT" == "3.5.14" ]]; then
            npm version 3.5.15 --no-git-tag-version
          elif [[ "$CURRENT" != "3.5.15" ]]; then
            echo "::error::Versione sorgente inattesa: $CURRENT"
            exit 1
          fi

          # Rende il test tooltip volutamente semplice e robusto.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ux-v3515.test.js')
          s=p.read_text(encoding='utf-8')
          old="    assert.match(html, new RegExp(`title=\"${label.replace(/[.*+?^${}()|[\\\\]\\\\]/g, '\\\\$&')}\"`));"
          new="    assert.ok(html.includes(`title=\"${label}\"`), `tooltip mancante: ${label}`);"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

          test "$(node -p "require('./package.json').version")" = "3.5.15"
          test "$(node -p "require('./package-lock.json').version")" = "3.5.15"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "3.5.15"

      - name: Test completi e preflight
        shell: bash
        working-directory: source/${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run check
          node scripts/release-preflight.cjs

      - name: Verifica perimetro modifiche UX
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git diff --check
          CHANGED="$(git status --short | awk '{print $2}')"
          printf '%s\n' "$CHANGED"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              "${APP_DIR}/styles.css"|"${APP_DIR}/responsive.css"|"${APP_DIR}/index.html"|"${APP_DIR}/ui-v3515.css"|"${APP_DIR}/tests/ux-v3515.test.js"|"${APP_DIR}/VERSIONE_3_5_15_UX.txt"|"${APP_DIR}/package.json"|"${APP_DIR}/package-lock.json") ;;
              *) echo "::error::File inatteso modificato: $file"; exit 1 ;;
            esac
          done <<< "$CHANGED"

          test -n "$CHANGED" || { echo '::error::Nessuna modifica da pubblicare'; exit 1; }
          grep -Fq '#logoutBtn{font-size:0}' "${APP_DIR}/styles.css"
          ! grep -Fq ".sidebar .btn-ghost:after{content:'Esci'" "${APP_DIR}/styles.css"
          grep -Fq '@import url("ui-v3515.css");' "${APP_DIR}/responsive.css"
          grep -Fq 'grid-template-areas:"title title" "lines summary"' "${APP_DIR}/ui-v3515.css"
          grep -Fq 'prefers-reduced-motion:reduce' "${APP_DIR}/ui-v3515.css"

          # Nessun file fiscale/Electron può essere modificato da questa release UX.
          if printf '%s\n' "$CHANGED" | grep -E '/electron/|/js/final-safety\.js|/js/final-day-guard\.js|/firestore\.rules'; then
            echo '::error::La patch UX ha toccato logica sensibile'; exit 1
          fi

      - name: Pubblica sorgente privato 3.5.15
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name "Riflessa Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${APP_DIR}/styles.css" "${APP_DIR}/responsive.css" "${APP_DIR}/index.html" "${APP_DIR}/ui-v3515.css" "${APP_DIR}/tests/ux-v3515.test.js" "${APP_DIR}/VERSIONE_3_5_15_UX.txt" "${APP_DIR}/package.json" "${APP_DIR}/package-lock.json"
          git commit -m "Rifinisce UI UX registratore 3.5.15"
          git remote set-url origin "https://x-access-token:${SOURCE_PAT}@github.com/${SOURCE_REPOSITORY}.git"
          git push origin HEAD:main

      - name: Avvia build firmata privata 3.5.15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-exe-registratore.yml --repo Mirkolas/riflessahairbeauty-workflows
